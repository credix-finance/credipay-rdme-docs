openapi: 3.0.0
paths:
  /v1/orders:
    post:
      description: >-
        Tries to create a new order. Will work if the buyer has enough credit
        limit and payment terms for the given order. Once successfully created,
        the total amount of the order will be subtracted from the buyer's
        available credit limit.
      operationId: post-create-order
      parameters: []
      requestBody:
        required: true
        description: Order data.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationOrderPostBodyDto'
      responses:
        '201':
          description: Successful operation, order created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMarketplaceOrderResponseDto'
        '400':
          description: Bad Request.
        '412':
          description: Preconditions Failed.
        '500':
          description: Internal Server Error.
      security:
        - auth0_jwt: []
        - api_key: []
      summary: Create an order
      tags:
        - Orders
      x-credix-security:
        scopes: []
        onProviders:
          - api_key
        keyNames:
          - x-credipay-api-key
    get:
      description: Lists all orders associated with the sellers linked to the application.
      operationId: list-orders
      parameters:
        - description: Returns orders with the provided external id.
          required: false
          name: externalId
          in: query
          schema:
            example: REF-10230456
            type: string
        - description: Updated after UTC date in ISO 8601 format.
          required: false
          name: updatedAfter
          in: query
          schema:
            default: '2024-02-05T00:00:00Z'
            type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetMarketplaceOrderResponseDto'
      security:
        - auth0_jwt: []
        - api_key: []
      summary: List orders
      tags:
        - Orders
      x-credix-security:
        scopes: []
        onProviders:
          - api_key
        keyNames:
          - x-credipay-api-key
  /v1/orders/notification:
    post:
      description: Send order notification(s) to relevant parties.
      operationId: post-handle-order-notification
      parameters: []
      requestBody:
        required: true
        description: Order notification data.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderNotificationPostDto'
      responses:
        '200':
          description: Successful operation.
      summary: Send order notification
      tags:
        - Orders
  /v1/orders/{orderId}:
    get:
      description: Gets an order by CrediPay's internal order ID.
      operationId: get-order
      parameters:
        - name: orderId
          required: true
          in: path
          description: CrediPay's internal order ID.
          schema:
            example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
            type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMarketplaceOrderResponseDto'
        '404':
          description: Order was not found.
      security:
        - auth0_jwt: []
        - api_key: []
      summary: Get an order
      tags:
        - Orders
      x-credix-security:
        scopes: []
        onProviders:
          - api_key
        keyNames:
          - x-credipay-api-key
  /v1/orders/{orderId}/cancel:
    post:
      description: >-
        Moves an order to cancelled state and increases the buyer's available
        credit limit by that order's total amount. If the order already has an
        invoice linked to it, it will be fully refunded.
      operationId: post-cancel-order
      parameters:
        - name: orderId
          required: true
          in: path
          description: CrediPay's internal order ID.
          schema:
            example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
            type: string
      responses:
        '200':
          description: Successful operation, order cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMarketplaceCanceledOrderResponseDto'
        '404':
          description: Order was not found.
        '409':
          description: >-
            Could not cancel order. Order could be already cancelled OR is not
            in any of the following states [created, accepted, finalized,
            rejected].
        '500':
          description: Internal Server Error.
      security:
        - auth0_jwt: []
        - api_key: []
      summary: Cancel an order
      tags:
        - Orders
      x-credix-security:
        scopes: []
        onProviders:
          - api_key
        keyNames:
          - x-credipay-api-key
  /v1/orders/{orderId}/documents:
    get:
      description: Gets all documents linked to an order.
      operationId: get-order-documents
      parameters:
        - name: orderId
          required: true
          in: path
          description: CrediPay's internal order ID.
          schema:
            example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
            type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrderDocumentsResponseDto'
        '404':
          description: Order was not found.
      security:
        - auth0_jwt: []
        - api_key: []
      summary: Get order documents
      tags:
        - Orders
      x-credix-security:
        scopes: []
        onProviders:
          - api_key
        keyNames:
          - x-credipay-api-key
  /v1/order-simulation:
    post:
      description: Gets the invoice amounts and the total fees for the possible order.
      operationId: post-order-simulation
      parameters: []
      requestBody:
        required: true
        description: Order data.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderSimulationPostBodyDto'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSimulationResponseDto'
        '404':
          description: Buyer or seller was not found.
        '409':
          description: >-
            Seller is not linked to application or the payment term days is
            invalid.
        '500':
          description: Internal Server Error.
      security:
        - auth0_jwt: []
        - api_key: []
      summary: Returns order simulation.
      tags:
        - Orders
      x-credix-security:
        scopes: []
        onProviders:
          - api_key
        keyNames:
          - x-credipay-api-key
  /v1/orders/{orderId}/refund:
    post:
      description: >-
        Refunds an order. When this endpoint is called, the amount CrediPay
        charges the buyer will be reduced by the amount passed in the body. If
        the given order was advanced to the seller, the refund amount will then
        be subtracted from the next disbursement the seller receives.
      operationId: post-order-refund
      parameters:
        - name: orderId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        description: Refund data.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundOrderPostBodyDto'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMarketplaceCanceledOrderResponseDto'
        '400':
          description: Bad Request.
      security:
        - auth0_jwt: []
        - api_key: []
      summary: Refund an order
      tags:
        - Orders
      x-credix-security:
        scopes: []
        onProviders:
          - api_key
        keyNames:
          - x-credipay-api-key
  /v1/orders/{orderId}/extension:
    post:
      description: Extends payment terms for an order for the given asset
      operationId: post-order-extend-payment-terms
      parameters:
        - name: orderId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        description: >-
          Number of days to extend the payment terms and the asset id for which
          the payment terms are to be extended.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendPaymentTermDaysPostBodyDto'
      responses:
        '200':
          description: Successful operation.
        '400':
          description: Bad Request.
      security:
        - auth0_jwt: []
        - api_key: []
      summary: Extends payment terms for an order
      tags:
        - Orders
      x-credix-security:
        scopes: []
        onProviders:
          - api_key
        keyNames:
          - x-credipay-api-key
  /v1/assets:
    get:
      deprecated: true
      description: >-
        Lists all installments (assets) linked to your account. This endpoint is
        deprecated, use /installments instead.
      operationId: list-installments-deprecated
      parameters:
        - name: assetStatus
          required: false
          in: query
          description: assetStatus Status of the installments to filter by.
          schema:
            enum:
              - Created
              - IssuancePending
              - IssuancePendingRetry
              - IssuanceFailed
              - IssuanceSuccess
              - AcquisitionPending
              - AcquisitionSuccess
              - AcquisitionFailed
              - AdvancePending
              - Advanced
              - NotAdvanced
              - Ineligible
              - Recourse
            type: string
        - name: collectionStatus
          required: false
          in: query
          description: Collection Status of the installments to filter by.
          schema:
            enum:
              - Open
              - ProcessingPayment
              - Repaid
              - Settled
              - Default
              - Canceled
            type: string
        - name: settledAtFromDate
          required: false
          in: query
          description: >-
            Filter installments (assets) settled after this date. Can be used
            together with settledAtToDate to query a date-range.
          schema:
            example: '2024-02-29T00:00:00.000Z'
            type: string
        - name: settledAtToDate
          required: false
          in: query
          description: >-
            Filter installments (assets) settled before this date. Can be used
            together with settledAtFromDate to query a date-range
          schema:
            example: '2024-02-29T00:00:00.000Z'
            type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetAssetResponseDto'
      security:
        - auth0_jwt: []
        - api_key: []
      summary: List installments
      tags:
        - Installments
      x-credix-security:
        scopes: []
        onProviders:
          - api_key
        keyNames:
          - x-credipay-api-key
  /v1/installments:
    get:
      deprecated: false
      description: Lists all installments (assets) linked to your account.
      operationId: list-installments
      parameters:
        - name: assetStatus
          required: false
          in: query
          description: assetStatus Status of the installments to filter by.
          schema:
            enum:
              - Created
              - IssuancePending
              - IssuancePendingRetry
              - IssuanceFailed
              - IssuanceSuccess
              - AcquisitionPending
              - AcquisitionSuccess
              - AcquisitionFailed
              - AdvancePending
              - Advanced
              - NotAdvanced
              - Ineligible
              - Recourse
            type: string
        - name: collectionStatus
          required: false
          in: query
          description: Collection Status of the installments to filter by.
          schema:
            enum:
              - Open
              - ProcessingPayment
              - Repaid
              - Settled
              - Default
              - Canceled
            type: string
        - name: settledAtFromDate
          required: false
          in: query
          description: >-
            Filter installments (assets) settled after this date. Can be used
            together with settledAtToDate to query a date-range.
          schema:
            example: '2024-02-29T00:00:00.000Z'
            type: string
        - name: settledAtToDate
          required: false
          in: query
          description: >-
            Filter installments (assets) settled before this date. Can be used
            together with settledAtFromDate to query a date-range
          schema:
            example: '2024-02-29T00:00:00.000Z'
            type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetAssetResponseDto'
      security:
        - auth0_jwt: []
        - api_key: []
      summary: List installments
      tags:
        - Installments
      x-credix-security:
        scopes: []
        onProviders:
          - api_key
        keyNames:
          - x-credipay-api-key
  /v1/buyers:
    get:
      description: >-
        Retrieve a list of buyers, each with their credit limits and seller
        configurations. Seller configurations include settings specific to the
        relationship between each buyer and seller. There is an optional
        parameter 'sellerTaxId'. If 'sellerTaxId' is provided, the response
        includes seller configurations for the specified seller only. If no
        'sellerTaxId' is provided, the response includes seller configurations
        for all sellers associated with the API key. This endpoint allows
        customization of data retrieval, enabling a focus on either a specific
        seller or configurations for all linked sellers.
      operationId: get-buyers
      parameters:
        - name: sellerTaxId
          required: false
          in: query
          description: >-
            Tax Id of the seller. It is used to filter the seller configurations
            defined for each buyer. If not provided the seller configurations
            for all sellers linked to the application are returned.
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: Page number of buyers to return.
          schema:
            type: number
        - name: take
          required: false
          in: query
          description: Limit of buyers to return.
          schema:
            type: number
        - name: order
          required: false
          in: query
          description: Order By of buyers to return.
          schema:
            enum:
              - ASC
              - DESC
            type: string
      responses:
        '200':
          description: The list of buyers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetBuyerDto'
      security:
        - auth0_jwt: []
        - api_key: []
      summary: Get buyers
      tags:
        - Buyers
      x-credix-security:
        scopes: []
        onProviders:
          - api_key
        keyNames:
          - x-credipay-api-key
  /v1/buyers/{taxId}:
    get:
      description: >-
        Retrieve a single buyer with their credit limits and seller
        configurations. Seller configurations include settings specific to the
        relationship between the buyer and seller. There is an optional
        parameter 'sellerTaxId'. If 'sellerTaxId' is provided, the response
        includes seller configurations for the specified seller only. If no
        'sellerTaxId' is provided, the response includes seller configurations
        for all sellers associated with the API key. This endpoint allows
        customization of data retrieval, enabling a focus on either a specific
        seller or configurations for all linked sellers.
      operationId: get-buyer
      parameters:
        - name: taxId
          required: true
          in: path
          description: Tax Id of the buyer.
          schema:
            example: '67016116000009'
            type: string
        - name: sellerTaxId
          required: false
          in: query
          description: >-
            Tax Id of the seller. It is used to filter the seller configurations
            defined for the buyer. If not provided the seller configurations for
            all sellers linked to the application are returned.
          schema:
            example: '85661377000063'
            type: string
      responses:
        '200':
          description: The buyer's information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBuyerDto'
      security:
        - auth0_jwt: []
        - api_key: []
      summary: Get buyer
      tags:
        - Buyers
      x-credix-security:
        scopes: []
        onProviders:
          - api_key
        keyNames:
          - x-credipay-api-key
  /v1/invoices:
    post:
      description: >-
        Allows you to submit a Nota Fiscal XML file. If orderId is not provided,
        a new order is created. If orderId is provided, the invoice is linked to
        the specified order. For an invoice to be accepted, it needs to be
        within the buyer's available credit limit and maximum payment terms.
      operationId: post-submit-invoice-xml
      parameters:
        - name: orderId
          required: false
          in: query
          description: >-
            CrediPay's internal order ID. UUID v4 format. If provided the
            uploaded invoice will be linked to this order.
          schema:
            example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
            type: string
      requestBody:
        required: true
        description: >-
          Nota Fiscal XML file. Needs to have been processed and approved by
          SEFAZ (draft XMLs are not allowed).
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                invoice:
                  type: string
                  format: binary
              required:
                - invoice
      responses:
        '200':
          description: Successful operation, Invoice uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInvoiceResponseDto'
        '400':
          description: Could not process the invoice XML due to a format error.
      security:
        - auth0_jwt: []
        - api_key: []
      summary: Submit Invoice XML
      tags:
        - Invoices
      x-credix-security:
        scopes: []
        onProviders:
          - api_key
        keyNames:
          - x-credipay-api-key
    get:
      description: Get all the invoices linked to the application.
      operationId: get-invoices
      parameters:
        - description: Returns invoices with the provided order id.
          required: false
          name: orderId
          in: query
          schema:
            example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
            type: string
        - description: Returns invoices with the provided external id.
          required: false
          name: externalId
          in: query
          schema:
            example: REF-10230456
            type: string
        - description: Returns invoices with the provided invoice number.
          required: false
          name: invoiceNumber
          in: query
          schema:
            example: Invoice-123456
            type: string
        - description: Updated after UTC date in ISO 8601 format.
          required: false
          name: updatedAfter
          in: query
          schema:
            default: '2024-02-05T00:00:00Z'
            type: string
      responses:
        '200':
          description: All invoices linked to the application.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceResponseDto'
      security:
        - auth0_jwt: []
        - api_key: []
      summary: Gets all the invoices
      tags:
        - Invoices
      x-credix-security:
        scopes: []
        onProviders:
          - api_key
        keyNames:
          - x-credipay-api-key
  /v1/invoices/{invoiceId}:
    get:
      description: Get information of an specific invoice.
      operationId: get-invoice
      parameters:
        - name: invoiceId
          required: true
          in: path
          description: Id of the invoice
          schema:
            type: string
      responses:
        '200':
          description: The invoice with the provided id was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponseDto'
        '400':
          description: Bad Request.
        '404':
          description: The invoice with the provided id was not found.
        '500':
          description: Internal Server Error.
      security:
        - auth0_jwt: []
        - api_key: []
      summary: Get Invoice
      tags:
        - Invoices
      x-credix-security:
        scopes: []
        onProviders:
          - api_key
        keyNames:
          - x-credipay-api-key
  /v1/orders/{orderId}/finalize:
    post:
      description: >-
        Moves an order to finalized state. Status for indicating the order is
        ready to be processed by the seller, and the goods will be delivered.
        After an order is finalized, you will be able to attach an invoice to
        it.
      operationId: post-finalize-order-and-process-invoice
      parameters:
        - name: orderId
          required: true
          in: path
          description: CrediPay's internal order ID.
          schema:
            example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
            type: string
      responses:
        '200':
          description: Successful operation, order finalized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMarketplaceOrderResponseDto'
        '404':
          description: Order was not found.
        '409':
          description: >-
            Could not finalize order. Order could be already finalized OR is not
            in accepted state.
        '500':
          description: Internal Server Error.
      security:
        - auth0_jwt: []
        - api_key: []
      summary: Finalize an order
      tags:
        - Orders
      x-credix-security:
        scopes: []
        onProviders:
          - api_key
        keyNames:
          - x-credipay-api-key
  /v1/webhook-events/endpoints/{endpointId}/resend:
    post:
      description: >-
        This endpoint lets customers resend failed webhooks. Messages sent
        successfully are not resent. The endpoint Id required can be found in
        the webhooks dashboard
      operationId: post-resend-failed-webhooks
      parameters:
        - name: endpointId
          required: true
          in: path
          description: Endpoint ID. Please get the endpoint Id from webhooks dashboard.
          schema:
            type: string
      requestBody:
        required: true
        description: Request body to resend failed webhooks.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhooksResendRequestDto'
      responses:
        '200':
          description: Successful operation.
        '500':
          description: Internal Server Error.
      security:
        - auth0_jwt: []
        - api_key: []
      summary: Resend failed webhooks.
      tags:
        - Webhooks
      x-credix-security:
        scopes: []
        onProviders:
          - api_key
        keyNames:
          - x-credipay-api-key
info:
  title: Credipay API
  description: ''
  version: '1.0'
  contact: {}
tags: []
servers:
  - url: https://api.pre.credix.finance
    description: Sandbox
components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: X-CREDIPAY-API-KEY
  schemas:
    OrderShippingLocationDto:
      type: object
      properties:
        address1:
          type: string
          description: Street address 1.
          default: Rua da Consolação, 930
        address2:
          type: string
          description: Street address 2.
          default: Apto 101
        city:
          type: string
          description: City.
          default: São Paulo
        region:
          type: string
          description: Region.
          default: São Paulo
        postalCode:
          type: string
          description: Postal code.
          default: '01302000'
        country:
          type: string
          description: Country.
          default: Brazil
      required:
        - address1
        - city
        - region
        - postalCode
        - country
    OrderInstallmentsDto:
      type: object
      properties:
        maturityDate:
          type: string
          description: Installments Maturity Date.
          default: '2024-02-10T00:00:00Z'
        faceValueCents:
          type: number
          description: Face value of the installment
          default: 1020000
      required:
        - maturityDate
        - faceValueCents
    OrderItemDto:
      type: object
      properties:
        productId:
          type: string
          description: Unique product identifier.
          default: '7891910000197'
        productName:
          type: string
          description: Name.
          default: Cerveja Skol 350ml
        quantity:
          type: number
          description: Quantity.
          default: 1000
        unitPriceCents:
          type: number
          description: Unit price in cents.
          default: 1020
      required:
        - productId
        - productName
        - quantity
        - unitPriceCents
    ContactInformationDto:
      type: object
      properties:
        email:
          type: string
          description: Contact's email.
          default: sales@acme.com
        phone:
          type: string
          description: Contact's phone number.
          default: '+551243974164'
        name:
          type: string
          description: Contact's name.
          default: First name
        lastName:
          type: string
          description: Contact's last name.
          default: Last name
      required:
        - phone
        - name
        - lastName
    CreateApplicationOrderPostBodyDto:
      type: object
      properties:
        externalId:
          type: string
          description: Seller's internal order ID.
          default: REF-10230456
        subtotalAmountCents:
          type: number
          description: The value of the order's goods and or services in cents.
          default: 1020000
        taxAmountCents:
          type: number
          description: Tax amount in cents.
          default: 81600
        shippingCostCents:
          type: number
          description: Shipping costs in cents.
          default: 5000
        shippingLocation:
          description: Shipping location.
          allOf:
            - $ref: '#/components/schemas/OrderShippingLocationDto'
        estimatedDeliveryDateUTC:
          format: date-time
          type: string
          description: Estimated delivery UTC date in ISO 8601 format.
          default: '2024-02-05T00:00:00Z'
        installments:
