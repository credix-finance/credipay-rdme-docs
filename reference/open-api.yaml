openapi: 3.0.0
paths:
  /v2/buyers:
    get:
      description: Gets all buyers associated with a seller.
      operationId: BuyersController_getBuyers
      parameters:
        - name: taxId
          required: false
          in: query
          description: CNPJ do comprador.
          schema:
            example: '56596567000127'
            type: string
        - name: page
          required: false
          in: query
          description: Qual página retornar da lista de compradores. Começa em 1.
          schema:
            minimum: 1
            default: 1
            type: number
        - name: take
          required: false
          in: query
          description: Limite de compradores a serem retornados.
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBuyersResponseDto'
      summary: Get buyers
      tags:
        - Buyers
  /v2/orders/{id}:
    get:
      description: Gets an order by CrediPay's internal order ID.
      operationId: OrdersController_getOrderById
      parameters:
        - name: id
          required: true
          in: path
          description: CrediPay's internal order ID. UUID v4 format.
          schema:
            format: uuid
            example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
            type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrderResponseDto'
        '404':
          description: Order was not found.
      summary: Get an order
      tags:
        - Orders
  /v2/orders/search:
    post:
      description: Searches for orders by various criteria.
      operationId: OrdersController_searchOrders
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchOrdersRequestDto'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchOrdersResponseDto'
      summary: Search orders
      tags:
        - Orders
  /v2/orders:
    post:
      description: Create an order by submitting a json payload.
      operationId: OrdersController_postOrder
      parameters: []
      requestBody:
        required: true
        description: Order data.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderDto'
      responses:
        '201':
          description: Successful operation, order created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrderResponseDto'
      summary: Create an order
      tags:
        - Orders
  /v2/orders/invoices:
    post:
      description: >-
        Allows you to create an order by submitting a Nota Fiscal XML file. If
        orderId is not provided, a new order is created. If orderId is provided,
        the invoice is linked to the specified order. For an invoice to be
        accepted, it needs to be within the buyer's available credit limit and
        maximum payment terms.
      operationId: OrdersController_postInvoiceXml
      parameters: []
      requestBody:
        required: true
        description: >-
          Nota Fiscal XML file. Needs to have been processed and approved by
          SEFAZ (draft XMLs are not allowed).
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                invoice:
                  type: string
                  format: binary
              required:
                - invoice
      responses:
        '400':
          description: Could not process the invoice XML due to a format error.
      summary: Create an order by NF-e
      tags:
        - Orders
        - Invoices
  /v2/orders/{id}/capture:
    post:
      description: >-
        This is an async endpoint that allows you to submit a Nota Fiscal XML
        file for an order. Once the xml file is submitted, a job will be
        triggered to perform validations and capture the order.
      operationId: OrdersController_captureOrder
      parameters:
        - name: id
          required: true
          in: path
          description: CrediPay's internal order ID. UUID v4 format.
          schema:
            example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
            type: string
      requestBody:
        required: true
        description: >-
          Nota Fiscal XML file. Needs to have been processed and approved by
          SEFAZ (draft XMLs are not allowed).
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                invoice:
                  type: string
                  format: binary
              required:
                - invoice
      responses:
        '400':
          description: >-
            Could not transition the order to the validating state due to an
            error.
      summary: Capture Order
      tags:
        - Orders
  /v2/orders/{id}/refund:
    post:
      description: >-
        This is an async endpoint that allows you to request a refund on an
        existing order.
      operationId: OrdersController_refundOrder
      parameters:
        - name: id
          required: true
          in: path
          description: CrediPay's internal order ID. UUID v4 format.
          schema:
            example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
            type: string
      requestBody:
        required: true
        description: Refund request data.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundOrderDto'
      responses:
        '200':
          description: Successful operation, refund request created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundOrderResponseDto'
        '400':
          description: >-
            Could not transition the order to the validating state due to an
            error.
      summary: Refund Order
      tags:
        - Orders
  /v2/orders/{id}/cancel:
    post:
      description: >-
        Moves an order to cancelled state and increases the buyer's available
        credit limit by that order's total amount. If the order already has an
        invoice linked to it, it will be fully refunded.
      operationId: OrdersController_cancelOrder
      parameters:
        - name: id
          required: true
          in: path
          description: CrediPay's internal order ID. UUID v4 format.
          schema:
            example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
            type: string
      responses:
        '204':
          description: Successful operation, order cancelled.
        '404':
          description: Order was not found.
        '409':
          description: >-
            Could not cancel order. Order could be already cancelled OR is not
            in any of the following states [created, accepted, finalized,
            rejected].
      summary: Cancel Order
      tags:
        - Orders
  /v2/orders/{id}/otp-verification:
    patch:
      description: Resends the OTP verification for an order.
      operationId: OrdersController_resendOtpVerification
      parameters:
        - name: id
          required: true
          in: path
          description: CrediPay's internal order ID. UUID v4 format.
          schema:
            example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
            type: string
      responses:
        '202':
          description: Successful operation, OTP verification resent.
        '400':
          description: >-
            Could not resend the OTP verification. OTP verification already
            completed.
        '404':
          description: Order was not found.
      summary: Resend OTP Verification
      tags:
        - Orders
  /v2/orders/{id}/otp-verification/complete:
    post:
      description: Completes the OTP verification for an order.
      operationId: OrdersController_completeOtpVerification
      parameters:
        - name: id
          required: true
          in: path
          description: CrediPay's internal order ID. UUID v4 format.
          schema:
            example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteOrderOtpVerificationDto'
      responses:
        '202':
          description: ''
      summary: Complete OTP Verification
      tags:
        - Orders
  /v2/repayments/webhooks/btg-empresas/fidc-payment-updates:
    post:
      description: Receives and processes a webhook payment updates event from BTG FIDC.
      operationId: webhook-btg-fidc-payment-updates
      parameters: []
      requestBody:
        required: true
        description: BTG FIDC payment updates event data.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BtgFidcPaymentWebhook'
      responses:
        '200':
          description: Webhook event received successfully.
        '404':
          description: Repayment not found.
        '500':
          description: Internal Server Error.
      summary: Process payment updates event
      tags:
        - Repayments
info:
  title: Credipay API
  description: ''
  version: '2.0'
  contact: {}
tags: []
servers:
  - url: https://api.pre.credix.finance
    description: Sandbox
components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: X-CREDIPAY-API-KEY
  schemas:
    BuyerResponseDto:
      type: object
      properties:
        id:
          type: string
          description: ID do comprador. (UUID)
          example: a0eebc4b-1f3d-4b2a-8c5f-7e6d5f8e9b2f
        taxId:
          type: string
          description: CNPJ do comprador.
          example: '56596567000127'
        availableCreditLimitAmountCents:
          type: number
          description: Limite de crédito disponível do comprador em centavos.
          example: 100000
        creditLimitAmountCents:
          type: number
          description: Limite de crédito do comprador em centavos.
          example: 100000
        eligible:
          type: boolean
          description: Se o comprador é elegível ou não para crédito.
          example: true
        inactive:
          type: boolean
          description: Se o comprador está marcado como inativo.
          example: false
        maxPaymentTermDays:
          type: number
          description: O prazo máximo de pagamento em dias.
        name:
          type: string
          description: Nome da empresa do comprador.
          example: Comprador Inexistente LTDA
        onboarded:
          type: boolean
          description: Se o comprador completou ou não o processo de onboarding.
          example: true
      required:
        - id
        - taxId
        - availableCreditLimitAmountCents
        - creditLimitAmountCents
        - eligible
        - inactive
        - maxPaymentTermDays
        - name
        - onboarded
    GetBuyersResponseDto:
      type: object
      properties:
        data:
          description: Lista de compradores.
          type: array
          items:
            $ref: '#/components/schemas/BuyerResponseDto'
        page:
          type: number
          description: Número da página.
          example: 1
        items:
          type: number
          description: Número de itens na página atual.
          example: 20
        total:
          type: number
          description: Número total de itens em todas as páginas.
          example: 100
      required:
        - data
        - page
        - items
        - total
    InvoiceResponseDto:
      type: object
      properties:
        id:
          type: string
          description: ID único da nota fiscal no sistema do CrediPay.
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
        invoiceNumber:
          type: string
          description: Número da nota fiscal.
          example: NFe00000000000000000000000001642012886703226971
        issuanceDate:
          type: string
          description: Data e hora de emissão da nota fiscal (ISO).
          example: '2023-10-02T15:30:00Z'
          format: date-time
        totalAmountCents:
          type: number
          description: Valor total da nota fiscal em centavos.
          example: 150000
      required:
        - id
        - invoiceNumber
        - issuanceDate
        - totalAmountCents
    OrderBuyerDto:
      type: object
      properties:
        id:
          type: string
          description: ID do comprador.
          example: a0eebc4b-1f3d-4b2a-8c5f-7e6d5f8e9b2f
          format: uuid
        taxId:
          type: string
          description: CNPJ do comprador.
          example: '56596567000127'
        name:
          type: string
          description: Nome do comprador.
          example: Comprador Inexistente LTDA
      required:
        - id
        - taxId
        - name
    OrderSellerDto:
      type: object
      properties:
        id:
          type: string
          description: ID do vendedor.
          example: a0eebc4b-1f3d-4b2a-8c5f-7e6d5f8e9b2f
          format: uuid
        taxId:
          type: string
          description: CNPJ do vendedor.
          example: '56596567000127'
        name:
          type: string
          description: Nome do vendedor.
          example: Nome Fictício Distribuidora LTDA
      required:
        - id
        - taxId
        - name
    RepaymentResponseDto:
      type: object
      properties:
        id:
          type: string
          description: ID único do pagamento.
          example: e912ba21-d530-4982-aa92-a06d7518afa0
          format: uuid
        pdfUrl:
          type: string
          description: URL para o arquivo PDF do pagamento (boleto).
          example: >-
            https://api.starkbank.com/v2/invoice/fb1553149ff34c8db238f36dc64a8232.pdf
        status:
          type: string
          description: Status do pagamento.
          example: Open
          enum:
            - Open
            - ProcessingPayment
            - Paid
            - Canceled
            - Expired
            - Unknown
            - Failed
            - CancellationFailed
            - Reversed
        totalAmountCents:
          type: number
          description: Valor total a ser pago em centavos.
          example: 100000
        createdAt:
          type: string
          description: Data e hora em que o pagamento foi criado.
          example: '2023-10-01T12:00:00Z'
          format: date-time
        dueDate:
          type: string
          description: Data de vencimento do pagamento.
          example: '2023-10-15T12:00:00Z'
          format: date-time
        paymentDate:
          type: string
          description: Data real em que o pagamento foi efetuado.
          example: '2023-10-10T12:00:00Z'
          format: date-time
          nullable: true
        paidAmountCents:
          type: number
          description: Valor efetivamente pago em centavos.
          example: 50000
        parentId:
          type: string
          description: "ID do pagamento pai, se aplicável (ex.: vinculado a outro pagamento). \t\t\tQuando um pedido é reembolsado, ou um pagamento é renegociado/estendido, o pagamento pai \t\t\tserá cancelado e um novo será criado."
          example: 3b27b131-7ab7-4a67-b88e-424c1d30b247
          format: uuid
          nullable: true
      required:
        - id
        - pdfUrl
        - status
        - totalAmountCents
        - createdAt
        - dueDate
        - paymentDate
        - paidAmountCents
        - parentId
    OrderErrorDto:
      type: object
      properties:
        code:
          type: string
          description: Código do erro.
          example: INVALID_TAX_ID
        message:
          type: string
          description: Mensagem de erro.
          example: O CNPJ fornecido é inválido.
      required:
        - code
        - message
    OrderRefundDto:
      type: object
      properties:
        id:
          type: string
          description: ID único do reembolso.
          example: e912ba21-d530-4982-aa92-a06d7518afa0
          format: uuid
        amountCents:
          type: number
          description: Valor do reembolso em centavos.
          example: 50000
        status:
          type: string
          description: Status do reembolso.
          example: Pending
          enum:
            - Pending
            - Completed
            - Failed
        createdAt:
          type: string
          description: Data e hora em que o reembolso foi criado.
          example: '2023-10-01T12:00:00Z'
          format: date-time
        error:
          type: string
          description: O erro que ocorreu durante o reembolso.
          example: Invalid tax ID format.
          nullable: true
      required:
        - id
        - amountCents
        - status
        - createdAt
        - error
    GetOrderResponseDto:
      type: object
      properties:
        id:
          type: string
          description: ID interno do pedido no CrediPay. Formato UUID v4.
          example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
          format: uuid
        createdAt:
          type: string
          description: Data de criação do pedido.
          example: '2023-10-01T12:00:00Z'
          format: date-time
        updatedAt:
          type: string
          description: Data de atualização do pedido.
          example: '2023-10-01T12:00:00Z'
          format: date-time
        acceptedAt:
          type: string
          description: Data em que o pedido foi aceito pelo comprador.
          example: '2023-10-01T12:00:00Z'
          format: date-time
        disbursedAt:
          type: string
          description: Data em que o pedido foi desembolsado para o vendedor.
          example: '2023-10-01T12:00:00Z'
          format: date-time
        capturedAt:
          type: string
          description: Data em que o pedido foi capturado (criação da nota fiscal).
          example: '2023-10-01T12:00:00Z'
          format: date-time
        externalId:
          type: string
          description: ID externo do pedido, se houver.
          example: '123456789'
        status:
          type: string
          description: Status do pedido.
          example: Accepted
          enum:
            - New
            - Created
            - Accepted
            - Cancelled
            - WaitingForInvoice
            - Captured
            - Expired
            - Validating
            - ValidationFailed
            - PartiallyRefunded
            - FullyRefunded
            - WaitingForOtp
        invoice:
          description: Nota fiscal do pedido.
          allOf:
            - $ref: '#/components/schemas/InvoiceResponseDto'
        buyer:
          description: Comprador do pedido.
          allOf:
            - $ref: '#/components/schemas/OrderBuyerDto'
        seller:
          description: Vendedor do pedido.
          allOf:
            - $ref: '#/components/schemas/OrderSellerDto'
        repayments:
          description: Informações de pagamento do pedido.
          type: array
          items:
            $ref: '#/components/schemas/RepaymentResponseDto'
        errors:
          description: "Qualquer tipo de erro que pode ocorrer durante a vida útil de um pedido. \t\t\tTanto erros de reembolso quanto de validação de nota fiscal estão incluídos aqui. \t\t\tErros de validação anteriores não são incluídos após uma nova tentativa bem-sucedida de upload de nota fiscal."
          type: array
          items:
            $ref: '#/components/schemas/OrderErrorDto'
        refunds:
          description: Reembolsos do pedido.
          type: array
          items:
            $ref: '#/components/schemas/OrderRefundDto'
        metadata:
          type: object
          description: Metadados passados pelo vendedor na criação do pedido.
          additionalProperties: true
          example:
            yourCustomFieldName: yourCustomFieldValue
        totalAmountCents:
          type: number
          description: "Valor total do pedido em centavos. \t\t \tSe o pedido tiver uma nota fiscal, este valor é retirado da nota fiscal;\n\t\t\tcaso contrário, é retirado do próprio pedido."
          example: 12345
      required:
        - id
        - createdAt
        - updatedAt
        - externalId
        - status
        - invoice
        - buyer
        - seller
        - repayments
        - errors
        - refunds
        - metadata
        - totalAmountCents
    SearchOrdersRequestDto:
      type: object
      properties:
        query:
          type: string
          description: A consulta a ser pesquisada.
        status:
          description: Considerar apenas pedidos com estes status.
          example:
            - Created
          type: array
          items:
            type: array
        createdAfter:
          format: date-time
          type: string
          description: Considerar apenas pedidos criados em ou após esta data.
          example: '2021-01-01T00:00:00.000Z'
        createdBefore:
          format: date-time
          type: string
          description: Considerar apenas pedidos criados antes ou em esta data.
          example: '2021-01-02T00:00:00.000Z'
        page:
          type: number
          description: Qual página retornar da lista de pedidos. Começa em 1.
          default: 1
          minimum: 1
        take:
          type: number
          description: Limite de pedidos a serem retornados.
          default: 20
          minimum: 1
          maximum: 100
      required:
        - query
    SearchOrdersResponseItemDto:
      type: object
      properties:
        status:
          type: string
          description: Status do pedido.
          example: Created
          enum:
            - New
            - Created
            - Accepted
            - Cancelled
            - WaitingForInvoice
            - Captured
            - Expired
            - Validating
            - ValidationFailed
            - PartiallyRefunded
            - FullyRefunded
            - WaitingForOtp
        id:
          type: string
          description: ID do pedido.
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
        externalId:
          type: string
          description: ID externo do pedido.
          example: NF-123456
        createdAt:
          type: string
          description: Data de criação do pedido.
          example: '2021-01-01T00:00:00.000Z'
          format: date-time
        updatedAt:
          type: string
          description: Data da última atualização do pedido.
          example: '2021-01-01T00:00:00.000Z'
          format: date-time
        disbursedAt:
          type: string
          description: Data em que o pedido foi desembolsado para o vendedor.
          example: '2021-01-01T00:00:00.000Z'
          format: date-time
        capturedAt:
          type: string
          description: Data em que o pedido foi capturado (criação da nota fiscal).
          example: '2021-01-01T00:00:00.000Z'
          format: date-time
        acceptedAt:
          type: string
          description: Data em que o pedido foi aceito pelo comprador.
          example: '2021-01-01T00:00:00.000Z'
          format: date-time
        totalAmountCents:
          type: number
          description: Valor total do pedido em centavos.
          example: 10000
        invoice:
          description: Informações da nota fiscal do pedido.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/InvoiceResponseDto'
        buyer:
          description: Informações do comprador do pedido.
          allOf:
            - $ref: '#/components/schemas/OrderBuyerDto'
        seller:
          description: Informações do vendedor do pedido.
          allOf:
            - $ref: '#/components/schemas/OrderSellerDto'
      required:
        - status
        - id
        - externalId
        - createdAt
        - updatedAt
        - totalAmountCents
        - invoice
        - buyer
        - seller
    SearchOrdersResponseDto:
      type: object
      properties:
        data:
          description: Lista de pedidos.
          type: array
          items:
            $ref: '#/components/schemas/SearchOrdersResponseItemDto'
        page:
          type: number
          description: Número da página.
          example: 1
        items:
          type: number
          description: Número de itens na página atual.
          example: 20
        total:
          type: number
          description: Número total de itens em todas as páginas.
          example: 100
      required:
        - data
        - page
        - items
        - total
    InstallmentsDto:
      type: object
      properties:
        maturityDate:
          type: string
          description: >-
            A data de vencimento. Deve ser fornecida essa ou termDays, mas não
            ambos.
          example: '2024-02-10T00:00:00Z'
          deprecated: true
        termDays:
          type: number
          description: >-
            Número de dias até o vencimento. Deve ser fornecida essa ou
            maturityDate, mas não ambos.
          example: 30
        faceValueCents:
          type: number
          description: Valor nominal da parcela em centavos.
          example: 1020000
      required:
        - faceValueCents
    OrderItemsDto:
      type: object
      properties:
        productId:
          type: string
          description: Identificador único do produto.
          default: '7891910000197'
        productName:
          type: string
          description: Nome do produto.
          default: Cerveja Skol 350ml
        quantity:
          type: number
          description: Quantidade.
          default: 15
        unitPriceCents:
          type: number
          description: Preço unitário em centavos.
          default: 1020
      required:
        - productId
        - productName
        - quantity
        - unitPriceCents
    ContactInformationDto:
      type: object
      properties:
        email:
          type: string
          description: E-mail do contato do comprador.
          example: joaodasilva@example.com
        phone:
          type: string
