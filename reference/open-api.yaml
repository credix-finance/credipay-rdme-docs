          example: '2024-02-29T00:00:00.000Z'
        repaymentDate:
          type: object
          description: >-
            Repayment date in ISO 8601 format. Defaults to null if the repayment
            has yet to be made.
          example: '2024-02-20T00:00:00.000Z'
        pdfURL:
          type: object
          description: Repayment PDF URL
          example: https://pdfurl.com
          default: https://pdfurl.com
      required:
        - id
        - status
        - amount
        - dueDate
        - repaymentDate
        - pdfURL
    InvoiceResponseDto:
      type: object
      properties:
        id:
          type: string
          description: Credipay's internal invoice ID. UUID v4 format.
          example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
        invoiceNumber:
          type: string
          description: Invoice number. Extracted from the NF-e.
          example: NFe35240341264992000141550010000007431018280440
        dueDate:
          type: string
          description: >-
            Invoice due date in ISO 8601 format. In the case of multiple
            installments, this is the due date of the last installment.
          example: '2024-02-29T00:00:00.000Z'
        issuanceDate:
          type: string
          description: Invoice issuance date in ISO 8601 format. Extracted from the NF-e.
          example: '2024-02-29T00:00:00.000Z'
        originalFaceValueCents:
          type: number
          description: Invoice face value cents.
          example: 10000
        faceValueCents:
          type: number
          description: Invoice face value cents.
          example: 10000
          deprecated: true
        currentFaceValueCents:
          type: number
          description: Invoice face value cents.
          example: 10000
        refundAmountCents:
          type: number
          description: Refund value cents.
          example: 10000
        refundStatus:
          type: string
          description: Refund status.
          enum:
            - NoRefund
            - PartialRefund
            - FullRefund
          example: NoRefund
        installments:
          description: Invoice installments.
          type: array
          items:
            $ref: '#/components/schemas/InstallmentDto'
        repayments:
          description: Invoice repayments.
          type: array
          items:
            $ref: '#/components/schemas/RepaymentDto'
        order:
          description: The order associated with this invoice
          allOf:
            - $ref: '#/components/schemas/InvoiceOrderDto'
        payer:
          description: The payer of the invoice
          allOf:
            - $ref: '#/components/schemas/InvoicePayerDto'
      required:
        - id
        - invoiceNumber
        - dueDate
        - issuanceDate
        - originalFaceValueCents
        - faceValueCents
        - currentFaceValueCents
        - refundAmountCents
        - refundStatus
        - installments
        - repayments
        - order
        - payer
    OrderErrorDto:
      type: object
      properties:
        code:
          type: object
          description: Error code.
          example: ORDER_NOT_FOUND_ERROR
        message:
          type: object
          description: Error message.
          example: Order not found.
      required:
        - code
        - message
    OrderEventWebhookBody:
      type: object
      properties:
        eventType:
          type: string
          description: Event type.
          enum:
            - order.created
            - order.cancelled
            - order.validation.failed
            - order.buyer.rejected
            - order.accepted
            - order.captured
            - order.partially_captured
            - order.buyer.accepted
            - order.boletos.issued
          example: order.buyer.accepted
        orderId:
          type: object
          description: The CrediPay order identifier.
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        orderExternalId:
          type: string
          description: >-
            The order identifier as set by the integrator. It is present when
            the order was created with an external id.
          example: or-123
        confirmationDate:
          type: string
          description: The acceptance date of the order, if it was accepted by the buyer.
          example: '2022-01-01T00:00:00Z'
        buyerTaxId:
          type: object
          description: Buyer Tax Id (CNPJ).
          example: '12345678000196'
        errors:
          description: Errors that occurred during the order process.
          example:
            - code: ORDER_NOT_FOUND_ERROR
              message: Order not found.
          type: array
          items:
            $ref: '#/components/schemas/OrderErrorDto'
      required:
        - eventType
        - orderId
        - buyerTaxId
        - errors
    RepaymentEventWebhookBody:
      type: object
      properties:
        eventType:
          type: string
          description: Event type.
          enum:
            - repayment.created
            - repayment.settled
            - repayment.cancelled
            - repayment.processing
            - repayment.edited
          example: repayment.created
        orderId:
          type: string
          description: The CrediPay order identifier.
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        orderExternalId:
          type: string
          description: >-
            The order identifier as set by the integrator. It is present when
            the order was created with an external id.
          example: or-123
          nullable: true
        invoiceId:
          type: string
          description: The CrediPay invoice identifier.
          example: facc63bc-5d73-4251-ab93-95ecd5338735
        invoiceNumber:
          type: string
          description: Invoice Number (= Nota Fiscal number).
          example: NFe35240737154724000108550010001280021404361475
        repaymentId:
          type: object
          description: The CrediPay repayment identifier
          example: 310b728e-8456-4495-b680-9a59d7a45e07
          nullable: true
        buyerTaxId:
          type: string
          description: Buyer Tax Id (CNPJ).
          example: '12345678000196'
        dueDate:
          format: date-time
          type: string
          description: Due date
          example: '2022-01-01T00:00:00Z'
        totalAmountCents:
          type: number
          description: Total amount in cents.
          example: 10000
        paymentCode:
          type: string
          description: >-
            Barcode/code, present if the repayment method is Boleto, BolePix or
            Pix.
          example: 34191.09008 64060.401046 00000.000000 1 00000000000000
          nullable: true
        pixEmv:
          type: string
          description: PIX EMV code, present if the repayment method is Pix or BolePix.
          example: >-
            00020101021126580014BR.GOV.BCB.PIX0136b69bc1f6-3f24-4d4b-8e15-12d29bf257cb5204000053039865802BR5920CREDIPAY
            TESTE LTDA6009SAO PAULO62070503***6304A1B2
          nullable: true
        paymentPdfUrl:
          type: string
          description: >-
            The pdf to make the payment, present if the repayment method is
            Boleto, BolePix or Pix.
          example: https://example.com/boleto.pdf
          nullable: true
        paidAmountCents:
          type: number
          description: Paid amount in cents, only present if the repayment is settled.
          example: 10000
          nullable: true
        repaymentParentId:
          type: string
          description: >-
            Parent repayment id, present if this repayment is created as a
            result of a refund/renegotiation. The parent repayment will be
            canceled.
          example: 520b728e-8456-4495-b680-9a59d7a452302
          nullable: true
        refundStatus:
          type: string
          description: The refund status of the order this repayment is associated with.
          enum:
            - NoRefund
            - PartialRefund
            - FullRefund
          example: NoRefund
        paymentMethod:
          type: string
          description: The payment method used to pay the repayment.
          enum:
            - Manual
            - StarkbankPixInvoice
            - StarkbankBoleto
            - BtgBoleto
            - BtgBolePix
            - BtgEverestBoleto
          example: BtgBolePix
        repaymentCreationEvent:
          type: string
          description: The event that led to the creation of the repayment.
          enum:
            - invoiceUploaded
            - refund
            - renegotiation
          example: invoiceUploaded
          nullable: true
      required:
        - eventType
        - orderId
        - invoiceId
        - invoiceNumber
        - repaymentId
        - buyerTaxId
        - dueDate
        - totalAmountCents
        - refundStatus
        - paymentMethod
    CreditLimitUnderwriteFinishedEventWebhookBody:
      type: object
      properties:
        eventType:
          type: string
          description: Event type.
          enum:
            - credit-limit.underwrite.finished
            - credit-limit.increase.finished
            - credit-limit.admin.underwrite.finished
          example: credit-limit.underwrite.finished
        id:
          type: string
          description: The ID of the credit limit underwrite request.
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        sellerTaxId:
          type: string
          description: The tax ID of the seller.
          example: '12345678000196'
        status:
          type: string
          description: The status of the credit limit underwrite request.
          enum:
            - Pending
            - Failed
            - Rejected
            - Finished
          example: Finished
        reason:
          type: string
          description: The reason for the 'Failed' or 'Rejected' states.
          example: Insufficient credit history
          nullable: true
        retryAfter:
          format: date-time
          type: string
          description: >-
            A datetime from which it is allowed to retry. Can be null if retry
            is not allowed
          example: '2024-03-20T10:00:00Z'
          nullable: true
        buyerTaxId:
          type: string
          description: The tax ID of the buyer.
          example: '12345678000196'
        creditLimitCents:
          type: number
          description: The current credit limit in cents.
          example: 1000000
        eligible:
          type: boolean
          description: Whether the buyer is eligible for credit.
          example: true
      required:
        - eventType
        - id
        - sellerTaxId
        - status
        - buyerTaxId
        - creditLimitCents
        - eligible
    CreditLimitIncreaseFinishedWebhookBody:
      type: object
      properties:
        eventType:
          type: string
          description: Event type.
          enum:
            - credit-limit.underwrite.finished
            - credit-limit.increase.finished
            - credit-limit.admin.underwrite.finished
          example: credit-limit.increase.finished
        id:
          type: string
          description: The ID of the credit limit increase request.
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        status:
          type: string
          description: The status of the credit limit increase request.
          enum:
            - Created
            - Pending
            - Approved
            - Partially Approved
            - Rejected
            - Failed
          example: Approved
        reason:
          type: string
          description: The reason for credit limit increase request states.
          example: Insufficient credit history
          nullable: true
        buyerTaxId:
          type: string
          description: The tax ID of the buyer.
          example: '12345678000196'
        sellerTaxId:
          type: string
          description: The tax ID of the seller.
          example: '12345678000196'
        creditLimitRequestedCents:
          type: number
          description: The requested credit limit in cents.
          example: 2000000
        creditLimitApprovedCents:
          type: number
          description: >-
            The approved credit limit in cents. Can be null if the credit limit
            increase was not approved.
          example: 1500000
          nullable: true
      required:
        - eventType
        - id
        - status
        - buyerTaxId
        - sellerTaxId
        - creditLimitRequestedCents
        - creditLimitApprovedCents
    UnderwritingDetailsDto:
      type: object
      properties:
        status:
          type: string
          description: Status of the underwriting flow
          example: completed
        details:
          type: string
          description: Details of the underwriting flow
          example: Underwriting completed successfully
          nullable: true
        decisionUrl:
          type: string
          description: URL of the Taktile run of the underwriting flow
          example: https://taktile.io/runs/123
          nullable: true
      required:
        - status
    OnboardingDetailsDto:
      type: object
      properties:
        status:
          type: string
          description: Status of the onboarding flow
          example: completed
        decisionUrl:
          type: string
          description: URL of the Taktile run of the onboarding flow
          example: https://taktile.io/runs/456
          nullable: true
      required:
        - status
    SellerStatusDto:
      type: object
      properties:
        status:
          type: string
          description: >-
            The status that is actually being displayed to the seller via the
            non-admin endpoint
          example: approved
        reason:
          type: string
          description: The reason for the failure or buyer rejection, if applicable
          example: Buyer rejected the offer
          nullable: true
        retryAfter:
          format: date-time
          type: string
          description: >-
            A datetime from which the seller is allowed to retry. Can be null if
            retry is not allowed
          example: '2024-03-20T10:00:00Z'
          nullable: true
      required:
        - status
    CreditLimitAdminUnderwriteFinishedWebhookBody:
      type: object
      properties:
        eventType:
          type: string
          description: Event type.
          enum:
            - credit-limit.underwrite.finished
            - credit-limit.increase.finished
            - credit-limit.admin.underwrite.finished
          example: credit-limit.admin.underwrite.finished
        id:
          type: string
          description: >-
            The same ID the sellers get from the POST endpoint - important to
            enable reconciliation on their end
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        taxId:
          type: string
          description: The tax ID of the buyer
          example: '12345678000196'
        sellerTaxId:
          type: string
          description: The tax ID of the seller
          example: '12345678000196'
        eligibility:
          type: boolean
          description: Whether the buyer is eligible for credit
          example: true
        creditRating:
          type: string
          description: The credit rating of the buyer
          example: A+
          nullable: true
        creditLimitCents:
          type: number
          description: The credit limit in cents
          example: 1000000
          nullable: true
        ineligibilityReason:
          type: string
          description: The reason for ineligibility if applicable
          example: Insufficient credit history
          nullable: true
        errorReason:
          type: string
          description: The error reason if applicable
          example: Failed to fetch credit report
          nullable: true
        paymentTerms:
          type: number
          description: The payment terms in days
          example: 30
          nullable: true
        segmentId:
          type: string
          description: The segment ID
          example: segment-123
          nullable: true
        createdAt:
          format: date-time
          type: string
          description: The creation date of the underwrite request
          example: '2024-03-20T10:00:00Z'
        underwriting:
          description: Underwriting flow details
          allOf:
            - $ref: '#/components/schemas/UnderwritingDetailsDto'
        onboarding:
          description: Onboarding flow details
          allOf:
            - $ref: '#/components/schemas/OnboardingDetailsDto'
        seller:
          description: Seller status details
          allOf:
            - $ref: '#/components/schemas/SellerStatusDto'
      required:
        - eventType
        - id
        - taxId
        - sellerTaxId
        - eligibility
        - createdAt
        - underwriting
        - onboarding
        - seller
    WebhooksResendRequestDto:
      type: object
      properties:
        since:
          format: date-time
          type: string
          description: Date-time from which the webhooks need to be resend
        until:
          format: date-time
          type: string
          description: Date-time till which the webhooks need to be resend
      required:
        - since
        - until
