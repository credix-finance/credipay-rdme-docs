    GetOrderResponseDto:
      type: object
      properties:
        id:
          type: string
          description: ID interno do pedido no CrediPay. Formato UUID v4.
          example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
          format: uuid
        createdAt:
          type: string
          description: Data de criação do pedido.
          example: '2023-10-01T12:00:00Z'
          format: date-time
        updatedAt:
          type: string
          description: Data de atualização do pedido.
          example: '2023-10-01T12:00:00Z'
          format: date-time
        acceptedAt:
          type: string
          description: Data em que o pedido foi aceito pelo comprador.
          example: '2023-10-01T12:00:00Z'
          format: date-time
        disbursedAt:
          type: string
          description: Data em que o pedido foi desembolsado para o vendedor.
          example: '2023-10-01T12:00:00Z'
          format: date-time
        disbursementRollupState:
          type: string
          description: >-
            Estado consolidado do desembolso por order, para a coluna Status da
            lista (APO-150). Preenchido pela busca; null em respostas de
            detalhe.
          example: null
          enum:
            - AwaitingBuyerPayment
            - Scheduled
            - Processing
            - InProgress
            - Completed
          nullable: true
        displayStatus:
          type: string
          description: >-
            Status efetivo do pedido (§4.1.d / APO-164) — mesma derivação
            server-side da coluna Status da lista. Preenchido no detalhe do
            seller; nulo no detalhe do buyer (a chave está presente com valor
            null — não confiar em presença de chave).
          example: Completed
          enum:
            - New
            - Created
            - Accepted
            - Cancelled
            - WaitingForInvoice
            - Captured
            - Expired
            - Validating
            - ValidationFailed
            - NfValidationFailed
            - PartiallyRefunded
            - FullyRefunded
            - WaitingForOtp
            - PartiallyCaptured
            - AwaitingBuyerPayment
            - Scheduled
            - Processing
            - InProgress
            - Completed
          nullable: true
        capturedAt:
          type: string
          description: Data em que o pedido foi capturado (criação da nota fiscal).
          example: '2023-10-01T12:00:00Z'
          format: date-time
        externalId:
          type: string
          description: ID externo do pedido, se houver.
          example: '123456789'
        status:
          type: string
          description: Status do pedido.
          example: Accepted
          enum:
            - New
            - Created
            - Accepted
            - Cancelled
            - WaitingForInvoice
            - Captured
            - Expired
            - Validating
            - ValidationFailed
            - NfValidationFailed
            - PartiallyRefunded
            - FullyRefunded
            - WaitingForOtp
            - PartiallyCaptured
        invoice:
          description: Nota fiscal do pedido.
          allOf:
            - $ref: '#/components/schemas/InvoiceResponseDto'
        invoices:
          description: Notas fiscais do pedido.
          nullable: false
          type: array
          items:
            $ref: '#/components/schemas/InvoiceResponseDto'
        buyer:
          description: Comprador do pedido.
          allOf:
            - $ref: '#/components/schemas/OrderBuyerDto'
        seller:
          description: Vendedor do pedido.
          allOf:
            - $ref: '#/components/schemas/OrderSellerDto'
        repayments:
          description: Informações de pagamento do pedido.
          type: array
          items:
            $ref: '#/components/schemas/RepaymentResponseDto'
        errors:
          description: "Qualquer tipo de erro que pode ocorrer durante a vida útil de um pedido. \t\t\tTanto erros de reembolso quanto de validação de nota fiscal estão incluídos aqui. \t\t\tErros de validação anteriores não são incluídos após uma nova tentativa bem-sucedida de upload de nota fiscal."
          type: array
          items:
            $ref: '#/components/schemas/OrderErrorDto'
        refunds:
          description: Reembolsos do pedido.
          type: array
          items:
            $ref: '#/components/schemas/OrderRefundDto'
        metadata:
          type: object
          description: Metadados passados pelo vendedor na criação do pedido.
          additionalProperties: true
          example:
            yourCustomFieldName: yourCustomFieldValue
        totalAmountCents:
          type: number
          description: "Valor total do pedido em centavos. \t\t \tSe o pedido tiver uma nota fiscal, este valor é retirado da nota fiscal;\n\t\t\tcaso contrário, é retirado do próprio pedido."
          example: 12345
        transactionFeeCents:
          type: number
          description: >-
            Taxa de transação total do pedido em centavos (Order-level, não
            recalculada por invoice).
          example: 5000
        disbursementSchedulingStrategy:
          type: string
          description: >-
            Estratégia de agendamento do desembolso. OnAssetCreation =
            antecipação; OnAssetDueDate / OnBuyerPayment = no-anticipation.
          example: OnAssetCreation
          enum:
            - OnAssetCreation
            - OnBuyerPayment
            - OnAssetDueDate
        disbursementDelayDays:
          type: number
          description: >-
            Dias adicionados à data base (vencimento do asset ou pagamento do
            comprador) para definir disburseOnDate. 0 para antecipação.
          example: 0
        refundBlocks:
          description: >-
            Bloqueios de reembolso ativos, calculados na carga do detalhe do
            pedido (APO-98). FE-5 mostra um card de bloqueio em vez dos cards de
            reembolso quando não vazio. Ausente em respostas de busca.
          type: array
          items:
            $ref: '#/components/schemas/RefundBlockDto'
      required:
        - id
        - createdAt
        - updatedAt
        - externalId
        - status
        - invoice
        - invoices
        - buyer
        - seller
        - repayments
        - errors
        - refunds
        - metadata
        - totalAmountCents
        - transactionFeeCents
        - disbursementSchedulingStrategy
        - disbursementDelayDays
    TaxIdFilterDto:
      type: object
      properties:
        value:
          type: string
          description: Tax ID do comprador. Filtra os pedidos pelo tax ID do comprador.
          example: '12345678901234'
        includeGroup:
          type: boolean
          description: >-
            Se true, filtra os pedidos pelo grupo econômico vinculado ao
            comprador com o tax ID especificado. Se false ou não fornecido,
            filtra apenas pelo tax ID do comprador.
          example: false
          default: false
      required:
        - value
    SearchOrdersRequestDto:
      type: object
      properties:
        query:
          type: string
          description: A consulta a ser pesquisada.
        status:
          description: Considerar apenas pedidos com estes status.
          example:
            - Created
          type: array
          items:
            type: array
        createdAfter:
          format: date-time
          type: string
          description: Considerar apenas pedidos criados em ou após esta data.
          example: '2021-01-01T00:00:00.000Z'
        createdBefore:
          format: date-time
          type: string
          description: Considerar apenas pedidos criados antes ou em esta data.
          example: '2021-01-02T00:00:00.000Z'
        page:
          type: number
          description: Qual página retornar da lista de pedidos. Começa em 1.
          default: 1
          minimum: 1
        take:
          type: number
          description: Limite de pedidos a serem retornados.
          default: 20
          minimum: 1
          maximum: 100
        taxId:
          description: Filtro de Tax ID do comprador.
          allOf:
            - $ref: '#/components/schemas/TaxIdFilterDto'
        anticipation:
          type: string
          description: >-
            Filtrar por antecipação. 'with' = pedidos antecipados
            (OnAssetCreation); 'without' = pedidos não antecipados
            (OnAssetDueDate ou OnBuyerPayment). Omitir retorna todos.
          enum:
            - with
            - without
          example: without
        displayStatus:
          type: array
          description: >-
            Filtro pelo status efetivo exibido na coluna Status da lista (§4.1.d
            / APO-164). Aceita status de ciclo de vida e estados de desembolso;
            multi-select = união, igual ao filtro `status`. Supersede `status`
            para a UI da lista — os valores casam exatamente com o que a coluna
            mostra.
          example:
            - Completed
          items:
            type: string
            enum:
              - New
              - Created
              - Accepted
              - Cancelled
              - WaitingForInvoice
              - Captured
              - Expired
              - Validating
              - ValidationFailed
              - NfValidationFailed
              - PartiallyRefunded
              - FullyRefunded
              - WaitingForOtp
              - PartiallyCaptured
              - AwaitingBuyerPayment
              - Scheduled
              - Processing
              - InProgress
              - Completed
      required:
        - query
