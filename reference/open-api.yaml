  /v2/orders/{id}/capture:
    post:
      description: >-
        Endpoint que permite enviar um arquivo XML de Nota Fiscal para um pedido
        existente. Assim que o arquivo XML é aceito, um job é disparado para
        realizar validações e capturar o pedido — parte das validações roda de
        forma assíncrona. Falhas síncronas (estado do pedido, lock em andamento,
        parsing do XML, validações internas de elegibilidade/política) retornam
        imediatamente nesta resposta.


        ### Formato dos erros

        Erros seguem o mesmo formato de `POST /v2/orders`: `CredixErrorResponse`
        (uma falha) ou `CredixAggregateErrorResponse` (várias falhas, em
        `errors[]`). O `code` é estável e deve ser usado para o tratamento
        programático.
      operationId: OrdersController_captureOrder
      parameters:
        - name: isPartialCapture
          required: false
          in: query
          description: Indica se esta captura deve ser tratada como captura parcial.
          schema:
            type: boolean
        - name: id
          required: true
          in: path
          description: ID interno de pedido da CrediPay. Formato UUID v4.
          schema:
            example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
            type: string
      requestBody:
        required: true
        description: >-
          Arquivo XML de Nota Fiscal. Precisa ter sido processado e aprovado
          pela SEFAZ (XMLs de rascunho não são permitidos).
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                invoice:
                  type: string
                  format: binary
              required:
                - invoice
      responses:
        '200':
          description: >-
            Solicitação de captura aceita. As validações finais rodam de forma
            assíncrona — consulte `GET /v2/orders/:id` para acompanhar a
            transição de estado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrderResponseDto'
        '400':
          description: >-
            Falha de validação do pedido. O corpo da resposta segue o formato
            `CredixErrorResponse` (erro único) ou `CredixAggregateErrorResponse`
            (várias validações falhando ao mesmo tempo, em `errors[]`).
          content:
            application/json:
              examples:
                NFE_PARSE_ERROR:
                  summary: XML da NF-e inválido
                  description: >-
                    O arquivo enviado não passou na validação de schema da NF-e.
                    Esse erro cobre toda falha de parsing — XML mal formado,
                    campos obrigatórios ausentes ou tipos inválidos. Veja
                    `context.error` para o detalhamento dos campos que falharam.


                    **Como resolver:** Verifique se o XML é uma NF-e autorizada
                    pela SEFAZ (não envie rascunhos). Os campos obrigatórios
                    incluem:

                    - `nfeProc.NFe.infNFe._Id` (chave de acesso, 44 dígitos)

                    - `ide.dhEmi` (data de emissão)

                    - `ide.nNF` (número curto da nota)

                    - `ide.tpNF` (tipo, deve ser 1)

                    - `emit.CNPJ` e `emit.xNome` (emitente)

                    - `emit.enderEmit.*` (endereço completo do emitente)

                    - `dest.CNPJ` e `dest.xNome` (destinatário)

                    - `dest.enderDest.*` (endereço completo do destinatário)

                    - `det[]` (itens)

                    - `total.ICMSTot.vNF` (valor total)

                    - `cobr.dup[]` (duplicatas com `nDup`, `dVenc`, `vDup`)
                  value:
                    message: >-
                      Could not parse NFE, please check if the xml is formed
                      correctly.
                    timestamp: '2026-05-18T12:34:56.000Z'
                    context:
                      error:
                        issues:
                          - path:
                              - nfeProc
                              - NFe
                              - infNFe
                              - dest
                              - CNPJ
                            code: invalid_type
                            message: Required
                    code: NFE_PARSE_ERROR
                    path: /v2/orders/46dd63dd-1be4-4658-8deb-fa5dc578ad0b/capture
                    request_id: 9f3a4b1c-2d5e-4f7a-8b6c-1e2d3a4b5c6d
                CREDIT_NOTE_NOT_SUPPORTED_ERROR:
                  summary: Nota de crédito não suportada
                  description: >-
                    O XML enviado é uma NF-e do tipo nota de crédito (`tpNF=0`).
                    Apenas NF-e normal de saída (`tpNF=1`) é aceita.


                    **Como resolver:** Reemita uma NF-e normal de saída antes de
                    tentar o upload novamente.
                  value:
                    message: Credit note is not supported.
                    timestamp: '2026-05-18T12:34:56.000Z'
