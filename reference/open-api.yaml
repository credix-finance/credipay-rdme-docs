          type: string
          description: Status do pedido.
          example: Created
          enum:
            - New
            - Created
            - Accepted
            - Cancelled
            - WaitingForInvoice
            - Captured
            - Expired
            - Validating
            - ValidationFailed
            - NfValidationFailed
            - PartiallyRefunded
            - FullyRefunded
            - WaitingForOtp
        id:
          type: string
          description: ID do pedido.
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
        externalId:
          type: string
          description: ID externo do pedido.
          example: NF-123456
        createdAt:
          type: string
          description: Data de criação do pedido.
          example: '2021-01-01T00:00:00.000Z'
          format: date-time
        updatedAt:
          type: string
          description: Data da última atualização do pedido.
          example: '2021-01-01T00:00:00.000Z'
          format: date-time
        disbursedAt:
          type: string
          description: Data em que o pedido foi desembolsado para o vendedor.
          example: '2021-01-01T00:00:00.000Z'
          format: date-time
        capturedAt:
          type: string
          description: Data em que o pedido foi capturado (criação da nota fiscal).
          example: '2021-01-01T00:00:00.000Z'
          format: date-time
        acceptedAt:
          type: string
          description: Data em que o pedido foi aceito pelo comprador.
          example: '2021-01-01T00:00:00.000Z'
          format: date-time
        totalAmountCents:
          type: number
          description: Valor total do pedido em centavos.
          example: 10000
