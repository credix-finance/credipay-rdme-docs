    CreateOrderDtoOpenApiSpec:
      type: object
      properties:
        buyerTaxId:
          type: string
          description: CNPJ do comprador.
          example: 65.413.430/0000-08
        sellerTaxId:
          type: string
          description: CNPJ do vendedor.
          example: 44.876.674/0000-49
        metadata:
          type: object
          description: Qualquer metadado que você queira anexar ao pedido.
          additionalProperties: true
          example:
            yourCustomFieldName: yourCustomFieldValue
        externalId:
          type: string
          description: ID interno do pedido do vendedor.
          default: REF-10230456
        installments:
          description: Parcelas
          type: array
          items:
            $ref: '#/components/schemas/InstallmentsDto'
        items:
          description: Itens do pedido.
          type: array
          items:
            $ref: '#/components/schemas/OrderItemsDto'
        contactInformation:
          description: Informações de Contato do comprador.
          allOf:
            - $ref: '#/components/schemas/ContactInformationDto'
        shippingLocation:
          description: Endereço de Entrega.
          allOf:
            - $ref: '#/components/schemas/ShippingLocationDto'
        processingMode:
          type: string
          description: >-
            O modo de processamento da nota fiscal. 'DDF' significa que o
            vendedor faz o upload da nota fiscal para a plataforma antes da
