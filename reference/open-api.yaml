            application/json:
              schema:
                example:
                  code: INVOICE_NUMBER_NOT_PROVIDED_ERROR
                  message: >-
                    Invoice number is required when the order has multiple
                    invoices.
                  httpStatus: 400
      summary: Reembolsar pedido
      tags:
        - Orders
  /v2/orders/{id}/cancel:
    post:
      description: >-
        Move um pedido para o estado cancelado e aumenta o limite de crédito
        disponível do comprador pelo valor total desse pedido. Se o pedido já
        tiver uma nota fiscal vinculada, ele será totalmente reembolsado.
      operationId: OrdersController_cancelOrder
      parameters:
        - name: id
          required: true
          in: path
          description: ID interno de pedido da CrediPay. Formato UUID v4.
          schema:
            example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
            type: string
      responses:
        '204':
          description: Operação bem-sucedida, pedido cancelado.
        '404':
          description: Pedido não foi encontrado.
        '409':
          description: >-
            Não foi possível cancelar o pedido. O pedido pode já estar cancelado
            OU não está em nenhum dos seguintes estados [created, accepted,
            finalized, rejected].
      summary: Cancelar pedido
      tags:
        - Orders
  /v2/disbursements:
    get:
      description: >-
        Este endpoint permite obter uma lista de repasses com base em parâmetros
        específicos.
        https://docs.credipay.credix.finance/docs/adicional-reconcilia%C3%A7%C3%A3o
      operationId: SellerDisbursementsController_getSellerDisbursements
      parameters:
        - name: page
          required: false
          in: query
          description: Número da página dos repasses.
          schema:
            minimum: 1
            default: 1
            example: 1
            type: number
        - name: take
          required: false
          in: query
          description: Quantidade de repasses a retornar.
          schema:
            minimum: 1
            maximum: 100
            default: 10
            example: 10
            type: number
        - name: startDate
          required: true
          in: query
          description: Data inicial dos repasses.
          schema:
            example: '2025-01-01'
            type: string
        - name: endDate
          required: false
          in: query
          description: Data final dos repasses.
          schema:
            default: '2026-06-12'
            example: '2025-01-01'
            type: string
        - name: includePending
          required: false
          in: query
          description: Inclui repasses pendentes quando true.
          schema:
            default: false
            example: false
            type: boolean
      responses:
        '200':
          description: Operação bem-sucedida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerDisbursementsResponseDto'
      summary: Buscar repasses de vendedores
      tags:
        - Disbursements
  /v2/users:
    get:
      description: >-
        Lista os usuários ativos restritos à organização autenticada resolvida a
        partir do contexto da requisição.
      operationId: UsersController_getUsers
      parameters: []
      responses:
        '200':
          description: Operação bem-sucedida.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SellerUserResponseDto'
      security:
        - auth0_jwt: []
        - api_key: []
      summary: Listar usuários da organização autenticada
      tags:
        - Users
      x-credix-security:
        scopes:
          - read:users
        onProviders:
          - auth0_jwt
        keyNames:
          - x-credipay-api-key
    post:
      description: >-
        Cria um usuário apenas na organização autenticada, atribui papéis no
        Auth0 e persiste a identidade local do usuário.
      operationId: UsersController_createUser
      parameters: []
      requestBody:
        required: true
        description: Dados do usuário.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSellerUserBodyDto'
      responses:
        '201':
          description: Operação bem-sucedida, usuário criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerUserResponseDto'
      security:
        - auth0_jwt: []
        - api_key: []
      summary: Criar usuário
      tags:
        - Users
      x-credix-security:
        scopes:
          - write:users
        onProviders:
          - auth0_jwt
        keyNames:
          - x-credipay-api-key
  /v2/users/me:
    get:
      description: >-
        Retorna a identidade interna do usuário da sessão autenticada dentro da
        organização autenticada.
      operationId: UsersController_getCurrentUser
      parameters: []
      responses:
        '200':
          description: Operação bem-sucedida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerUserResponseDto'
        '404':
          description: Usuário não foi encontrado.
      security:
        - auth0_jwt: []
        - api_key: []
      summary: Obter usuário atual
      tags:
        - Users
      x-credix-security:
        scopes: []
        onProviders:
          - auth0_jwt
        keyNames:
          - x-credipay-api-key
  /v2/users/{id}:
    patch:
      description: >-
        Atualiza um usuário ativo apenas dentro da organização autenticada e
        mantém o Auth0 e a identidade local sincronizados.
      operationId: UsersController_updateUser
      parameters:
        - name: id
          required: true
          in: path
          description: Id interno do usuário.
          schema:
            example: 123e4567-e89b-12d3-a456-426614174000
            type: string
      requestBody:
        required: true
        description: Dados para atualização do usuário.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSellerUserBodyDto'
      responses:
        '200':
          description: Operação bem-sucedida, usuário atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerUserResponseDto'
        '404':
          description: Usuário não foi encontrado.
      security:
        - auth0_jwt: []
        - api_key: []
      summary: Atualizar usuário
      tags:
        - Users
      x-credix-security:
        scopes:
          - write:users
        onProviders:
          - auth0_jwt
        keyNames:
          - x-credipay-api-key
    delete:
      description: >-
        Revoga o acesso no Auth0, invalida os tokens de atualização e realiza a
        exclusão lógica do usuário local apenas na organização autenticada.
      operationId: UsersController_deleteUser
      parameters:
        - name: id
          required: true
          in: path
          description: Id interno do usuário.
          schema:
            example: 123e4567-e89b-12d3-a456-426614174000
            type: string
      responses:
        '204':
          description: Operação bem-sucedida, usuário excluído.
        '404':
          description: Usuário não foi encontrado.
      security:
        - auth0_jwt: []
        - api_key: []
      summary: Exclui usuário
      tags:
        - Users
      x-credix-security:
        scopes:
          - write:users
        onProviders:
          - auth0_jwt
        keyNames:
          - x-credipay-api-key
  /v2/sellers:
    get:
      description: Retorna todos os vendedores associados à organização atual.
      operationId: api-v2-get-organization-sellers
      parameters: []
      responses:
        '200':
          description: Operação realizada com sucesso, vendedores retornados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetOrganizationSellersResponseDto'
      summary: Obter vendedores vinculados à organização
      tags:
        - Sellers
  /v2/sellers/disbursement-config:
    get:
      description: >-
        Gate org-level da UI no-anticipation: indica se a organização tem ao
        menos um segmento no-anticipation efetivo (flag Statsig ON + segmento
        configurado com estratégia diferente de OnAssetCreation).
      operationId: api-v2-get-disbursement-config
      parameters: []
      responses:
        '200':
          description: >-
            Operação realizada com sucesso, configuração de desembolso
            retornada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDisbursementConfigResponseDto'
      summary: Obter configuração de desembolso da organização
      tags:
        - Sellers
  /v2/webhooks/session:
    get:
      description: >-
        Retorna a URL e o token de sessão para acessar o painel de webhooks da
        organização na plataforma Svix. A URL e o token são válidos por 7 dias.
      operationId: api-v2-get-webhook-dashboard-session-url
      parameters: []
      responses:
        '200':
          description: Operação realizada com sucesso, URL de sessão retornada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDashboardSessionUrlResponseDto'
      summary: Obter URL de sessão do painel de webhooks
      tags:
        - Webhooks
  /v2/webhooks/endpoints/{endpointId}/resend:
    post:
      description: >-
        Reenvia os webhooks que falharam em um determinado período. Mensagens
        enviadas com sucesso não são reenviadas. O ID do endpoint pode ser
        encontrado no painel de webhooks.
      operationId: api-v2-post-resend-failed-webhooks
      parameters:
        - name: endpointId
          required: true
          in: path
          description: ID do endpoint. Obtenha o ID do endpoint no painel de webhooks.
          schema:
            type: string
      requestBody:
        required: true
        description: Dados para reenvio dos webhooks com falha.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhooksResendRequestDto'
      responses:
        '200':
          description: Operação realizada com sucesso.
      summary: Reenviar webhooks com falha
      tags:
        - Webhooks
info:
  title: Credipay API
  description: ''
  version: '2.0'
  contact: {}
tags: []
servers:
  - url: https://api.pre.credix.finance
    description: Sandbox
components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: X-CREDIPAY-API-KEY
  schemas:
    BuyerGroupMemberDto:
      type: object
      properties:
        taxId:
          type: string
          description: CNPJ do membro do grupo.
          example: '56596567000127'
        name:
          type: string
          description: Nome do membro do grupo.
          example: Comprador Inexistente LTDA
      required:
        - taxId
        - name
    BuyerResponseDto:
      type: object
      properties:
        id:
          type: string
          description: ID do comprador. (UUID)
          example: a0eebc4b-1f3d-4b2a-8c5f-7e6d5f8e9b2f
        taxId:
          type: string
          description: CNPJ do comprador.
          example: '56596567000127'
        availableCreditLimitAmountCents:
          type: number
          description: Limite de crédito disponível do comprador em centavos.
          example: 100000
        creditLimitAmountCents:
          type: number
          description: Limite de crédito do comprador em centavos.
          example: 100000
        creditLimitUpdatedAt:
          type: string
          description: Data de atualização do limite de crédito do comprador.
          example: '2021-01-01T00:00:00.000Z'
        eligible:
          type: boolean
          description: Se o comprador é elegível ou não para crédito.
          example: true
          deprecated: true
        eligibilityUpdatedAt:
          type: string
          description: Data de atualização da elegibilidade do comprador.
          example: '2021-01-01T00:00:00.000Z'
        inactive:
          type: boolean
          description: Se o comprador está marcado como inativo.
          example: false
        maxPaymentTermDays:
          type: number
          description: O prazo máximo de pagamento em dias.
        name:
          type: string
          description: Nome da empresa do comprador.
          example: Comprador Inexistente LTDA
        onboarded:
          type: boolean
          description: Se o comprador completou ou não o processo de onboarding.
          example: true
        disbursementSchedulingStrategy:
          type: string
          description: >-
            Estratégia efetiva de agendamento do desembolso do segmento do
            comprador (resolvida via Statsig — OnAssetCreation quando a flag
            está OFF). OnAssetCreation = antecipação; OnAssetDueDate /
            OnBuyerPayment = no-anticipation. Presente apenas no path de
            comprador único (taxId); ausente na listagem paginada.
          example: OnAssetCreation
          enum:
            - OnAssetCreation
            - OnBuyerPayment
            - OnAssetDueDate
        disbursementDelayDays:
          type: number
          description: >-
            Dias adicionados à data base (vencimento ou pagamento do comprador)
            para definir a data de desembolso. 0 para antecipação. Presente
            apenas no path de comprador único (taxId).
          example: 0
        groupMembers:
          description: Membros do grupo do comprador.
          type: array
          items:
            $ref: '#/components/schemas/BuyerGroupMemberDto'
      required:
        - id
        - taxId
        - availableCreditLimitAmountCents
        - creditLimitAmountCents
        - creditLimitUpdatedAt
        - eligible
        - eligibilityUpdatedAt
        - inactive
        - maxPaymentTermDays
        - name
        - onboarded
        - groupMembers
    GetBuyersResponseDto:
      type: object
      properties:
        data:
          description: Lista de compradores.
          type: array
          items:
            $ref: '#/components/schemas/BuyerResponseDto'
        page:
          type: number
          description: Número da página.
          example: 1
        items:
          type: number
          description: Número de itens na página atual.
          example: 20
        total:
          type: number
          description: Número total de itens em todas as páginas.
          example: 100
      required:
        - data
        - page
        - items
        - total
    InvoiceFeesResponseDto:
      type: object
      properties:
        transactionFeePercentage:
          type: number
          description: >-
            Taxa de transação como percentual do valor da nota fiscal (decimal,
            0-1).
          example: 0.025
        transactionFeeCents:
          type: number
          description: Taxa de transação total da nota fiscal em centavos.
          example: 3750
        monthlyDiscountRate:
          type: number
          description: Taxa mensal de desconto (decimal) snapshot do pedido.
          example: 0.018
        discountFeeCents:
          type: number
          description: Soma dos descontos por antecipação na nota fiscal em centavos.
          example: 1200
        totalFee:
          type: number
          description: >-
            Taxa total (transação + desconto) como fração do valor da nota
            fiscal.
          example: 0.033
        totalFeeCents:
          type: number
          description: Soma das taxas (transação + desconto) em centavos.
          example: 4950
      required:
        - transactionFeePercentage
        - transactionFeeCents
        - monthlyDiscountRate
        - discountFeeCents
        - totalFee
        - totalFeeCents
    InvoiceAssetSellerDisbursementResponseDto:
      type: object
      properties:
        status:
          type: string
          description: >-
            Estado do desembolso ao vendedor desta duplicata. `None` = nenhuma
            SellerDisbursement criada (anticipação pré-desembolso, no-anticip
            pré-borderô, ineligible). `Open` é colapsado em `Pending` no wire
            (não exposto). `Pending` = agendada. `Settled` = realizada. `Failed`
            = retried-out.
          example: Pending
          enum:
            - None
            - Pending
            - Settled
            - Failed
        settledAt:
          type: string
          description: Data efetiva do desembolso ao vendedor. Null até atingir `Settled`.
          example: '2026-05-12T10:30:00Z'
          format: date-time
          nullable: true
      required:
        - status
        - settledAt
    InvoiceAssetCashStateResponseDto:
      type: object
      properties:
        buyerPaid:
          type: boolean
          description: >-
            Comprador pagou esta duplicata: true quando qualquer repayment órfã
            (parent_id IS NULL) está paga. O filtro órfão honra o §5.1 canônico
            (sem proxy de filha-paga).
          example: true
        sellerDisbursed:
          type: boolean
          description: >-
            Vendedor já foi desembolsado por esta duplicata
            (sellerDisbursement.status === 'Settled').
          example: false
      required:
        - buyerPaid
        - sellerDisbursed
    InvoiceAssetResponseDto:
      type: object
      properties:
        id:
          type: string
          description: ID único da duplicata.
          example: f1c8ec9f-d2c9-4a02-9cbd-2b1a3f8f5e1b
          format: uuid
        status:
          type: string
          description: Status da duplicata.
          example: AcquisitionSuccess
        collectionStatus:
          type: string
          description: Status de cobrança da duplicata.
          example: Open
        faceValueCents:
          type: number
          description: Valor de face atual da duplicata (pós-reembolsos) em centavos.
          example: 50000
        refundAmountCents:
          type: number
          description: Valor reembolsado da duplicata em centavos.
          example: 0
        refundStatus:
          type: string
          description: Status de reembolso da duplicata.
          example: NoRefund
        originalFaceValueCents:
          type: number
          description: >-
            Valor de face original da duplicata (antes de quaisquer reembolsos)
            em centavos.
          example: 50000
        disburseOnDate:
          type: string
          description: >-
            Data agendada de desembolso para o vendedor (no-anticipation). Null
            em pedidos com antecipação ou enquanto OnBuyerPayment aguarda
            pagamento.
          example: '2026-06-30T00:00:00Z'
          format: date-time
          nullable: true
        sellerDisbursement:
          description: >-
            Estado do desembolso ao vendedor desta duplicata (APO-96 / BE-1c).
            Wire enum {None, Pending, Settled, Failed} (entidade `Open` aliasada
            para `Pending`). Ausente em endpoints que não computam (ex.:
            listagem de pedidos).
          allOf:
            - $ref: '#/components/schemas/InvoiceAssetSellerDisbursementResponseDto'
        cashState:
          description: >-
            Estado de caixa por-duplicata para o fluxo de reembolso (APO-98 /
            FE-5 §5.1). Ausente em endpoints que não computam (ex.: listagem de
            pedidos).
          allOf:
            - $ref: '#/components/schemas/InvoiceAssetCashStateResponseDto'
      required:
        - id
        - status
        - collectionStatus
        - faceValueCents
        - refundAmountCents
        - refundStatus
        - originalFaceValueCents
        - disburseOnDate
    InvoiceResponseDto:
      type: object
      properties:
        id:
          type: string
          description: ID único da nota fiscal no sistema do CrediPay.
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
        invoiceNumber:
          type: string
          description: Número da nota fiscal.
          example: NFe00000000000000000000000001642012886703226971
        shortInvoiceNumber:
          type: string
          description: Número curto da nota fiscal.
          example: '0992346'
          nullable: true
        issuanceDate:
          type: string
          description: Data e hora de emissão da nota fiscal (ISO).
          example: '2023-10-02T15:30:00Z'
          format: date-time
        totalAmountCents:
          type: number
          description: Valor total da nota fiscal em centavos.
          example: 150000
        fees:
          description: >-
            Detalhamento das taxas aplicadas à nota fiscal. Ausente em endpoints
            que não computam (ex.: listagem de pedidos).
          allOf:
            - $ref: '#/components/schemas/InvoiceFeesResponseDto'
        disbursedAmountCents:
          type: number
          description: >-
            Valor já desembolsado ao vendedor referente a esta nota fiscal, em
            centavos.
          example: 145050
        expectedPayoutCents:
          type: number
          description: >-
            Valor líquido esperado a receber pelo vendedor referente a esta nota
            fiscal (totalAmountCents - totalFeeCents), em centavos.
          example: 145050
        refundableAmountCents:
          type: number
          description: >-
            Valor ainda reembolsável referente a esta nota fiscal (original - já
            reembolsado), em centavos.
          example: 50000
        totalRefundedAmountCents:
          type: number
          description: >-
            Soma dos reembolsos efetuados referentes a esta nota fiscal, em
            centavos.
          example: 0
        refundStatus:
          type: string
          description: >-
            Status agregado de reembolso da nota fiscal (NoRefund |
            PartialRefund | FullRefund).
          example: NoRefund
        assets:
          description: Lista de duplicatas que compõem esta nota fiscal.
          type: array
          items:
            $ref: '#/components/schemas/InvoiceAssetResponseDto'
      required:
        - id
        - invoiceNumber
        - issuanceDate
        - totalAmountCents
    OrderBuyerDto:
      type: object
      properties:
        id:
          type: string
          description: ID do comprador.
          example: a0eebc4b-1f3d-4b2a-8c5f-7e6d5f8e9b2f
          format: uuid
        taxId:
          type: string
          description: CNPJ do comprador.
          example: '56596567000127'
        name:
          type: string
          description: Nome do comprador.
          example: Comprador Inexistente LTDA
      required:
        - id
        - taxId
        - name
    OrderSellerDto:
      type: object
      properties:
        id:
          type: string
          description: ID do vendedor.
          example: a0eebc4b-1f3d-4b2a-8c5f-7e6d5f8e9b2f
          format: uuid
        taxId:
          type: string
          description: CNPJ do vendedor.
          example: '56596567000127'
        name:
          type: string
          description: Nome do vendedor.
          example: Nome Fictício Distribuidora LTDA
      required:
        - id
        - taxId
        - name
    RepaymentIssuerDto:
      type: object
      properties:
        taxId:
          type: string
          description: CNPJ da facility (emissor).
          example: '12345678000190'
        razaoSocial:
          type: string
          description: Razão social da facility (emissor).
          example: Credix Securitizadora III S.A.
      required:
        - taxId
        - razaoSocial
    RepaymentPayeeDto:
      type: object
      properties:
        branchNumber:
          type: string
          description: Número da agência bancária.
          example: '0001'
        branchDigit:
          type: string
          description: Dígito da agência bancária.
          example: '1'
        accountNumber:
          type: string
          description: Número da conta bancária.
          example: '12345678'
        accountDigit:
          type: string
          description: Dígito da conta bancária.
          example: '9'
        bankIdentificationCode:
          type: string
          description: Código de identificação bancária (ISPB).
          example: '001'
      required:
        - branchNumber
        - branchDigit
        - accountNumber
        - accountDigit
        - bankIdentificationCode
    RepaymentResponseDto:
      type: object
      properties:
        id:
          type: string
          description: ID único do pagamento.
          example: e912ba21-d530-4982-aa92-a06d7518afa0
          format: uuid
        pdfUrl:
          type: string
          description: URL para o arquivo PDF do pagamento (boleto).
          example: >-
            https://api.starkbank.com/v2/invoice/fb1553149ff34c8db238f36dc64a8232.pdf
        status:
          type: string
          description: Status do pagamento.
          example: Open
          enum:
            - Open
            - ProcessingPayment
            - Paid
            - Canceled
            - Expired
            - Unknown
            - Failed
            - CancellationFailed
            - Reversed
        totalAmountCents:
          type: number
          description: Valor total a ser pago em centavos.
          example: 100000
        createdAt:
          type: string
          description: Data e hora em que o pagamento foi criado.
          example: '2023-10-01T12:00:00Z'
          format: date-time
        dueDate:
          type: string
          description: Data de vencimento do pagamento.
          example: '2023-10-15T12:00:00Z'
          format: date-time
        paymentDate:
          type: string
          description: Data real em que o pagamento foi efetuado.
          example: '2023-10-10T12:00:00Z'
          format: date-time
          nullable: true
        paidAmountCents:
          type: number
          description: Valor efetivamente pago em centavos.
          example: 50000
        parentId:
          type: string
          description: "ID do pagamento pai, se aplicável (ex.: vinculado a outro pagamento). \t\t\tQuando um pedido é reembolsado, ou um pagamento é renegociado/estendido, o pagamento pai \t\t\tserá cancelado e um novo será criado."
          example: 3b27b131-7ab7-4a67-b88e-424c1d30b247
          format: uuid
          nullable: true
        documentNumber:
          type: string
          description: >-
            Número do documento: número curto da nota fiscal + '-' + número
            único do ativo.
          example: 0992346-001
          nullable: true
        duplicata:
          type: string
          description: Número único da duplicata (parcela).
          example: '123456789'
          nullable: true
        paymentCode:
          type: string
          description: Código de pagamento do boleto.
          example: 34191.79001 01043.510047 91020.150008 6 91570000002000
          nullable: true
        pixEmv:
          type: string
          description: Código EMV para pagamento via PIX.
          example: 00020101021126580014BR.GOV.BCB.PIX0136b69bc...
          nullable: true
        issuer:
          description: Informações do emissor (facility).
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RepaymentIssuerDto'
        payee:
          description: Informações do beneficiário (conta bancária da empresa vendedora).
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RepaymentPayeeDto'
        monthlyLateFeeRate:
          type: number
          description: Taxa de juros mensal por atraso.
          example: 0.02
        fixedLateFeePercentage:
          type: number
          description: Percentual fixo de multa por atraso.
          example: 0.1
      required:
        - id
        - pdfUrl
        - status
        - totalAmountCents
        - createdAt
        - dueDate
        - paymentDate
        - paidAmountCents
        - parentId
        - documentNumber
        - issuer
        - payee
        - monthlyLateFeeRate
        - fixedLateFeePercentage
