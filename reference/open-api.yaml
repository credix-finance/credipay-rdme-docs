          description: Informações da nota fiscal do pedido.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/InvoiceResponseDto'
        buyer:
          description: Informações do comprador do pedido.
          allOf:
            - $ref: '#/components/schemas/OrderBuyerDto'
        seller:
          description: Informações do vendedor do pedido.
          allOf:
            - $ref: '#/components/schemas/OrderSellerDto'
