openapi: 3.0.0
paths:
  /v1/buyers:
    get:
      description: >-
        Retrieve a list of buyers, each with their credit limits and seller
        configurations. Seller configurations include settings specific to the
        relationship between each buyer and seller. There is an optional
        parameter 'sellerTaxId'. If 'sellerTaxId' is provided, the response
        includes seller configurations for the specified seller only. If no
        'sellerTaxId' is provided, the response includes seller configurations
        for all sellers associated with the API key. This endpoint allows
        customization of data retrieval, enabling a focus on either a specific
        seller or configurations for all linked sellers.
      operationId: get-buyers
      parameters:
        - name: sellerTaxId
          required: false
          in: query
          description: >-
            Tax Id of the seller. It is used to filter the seller configurations
            defined for each buyer. If not provided the seller configurations
            for all sellers linked to the application are returned.
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: Page number of buyers to return.
          schema:
            type: number
        - name: take
          required: false
          in: query
          description: Limit of buyers to return.
          schema:
            type: number
        - name: order
          required: false
          in: query
          description: Order By of buyers to return.
          schema:
            enum:
              - ASC
              - DESC
            type: string
      responses:
        '200':
          description: The list of buyers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetBuyerDto'
      security:
        - auth0_jwt: []
        - api_key: []
      summary: Get buyers
      tags:
        - Buyers
      x-credix-security:
        scopes: []
        onProviders:
          - api_key
        keyNames:
          - x-credipay-api-key
  /v1/buyers/{taxId}:
    get:
      description: >-
        Retrieve a single buyer with their credit limits and seller
        configurations. Seller configurations include settings specific to the
        relationship between the buyer and seller. There is an optional
        parameter 'sellerTaxId'. If 'sellerTaxId' is provided, the response
        includes seller configurations for the specified seller only. If no
        'sellerTaxId' is provided, the response includes seller configurations
        for all sellers associated with the API key. This endpoint allows
        customization of data retrieval, enabling a focus on either a specific
        seller or configurations for all linked sellers.
      operationId: get-buyer
      parameters:
        - name: taxId
          required: true
          in: path
          description: Tax Id of the buyer.
          schema:
            example: '67016116000009'
            type: string
        - name: sellerTaxId
          required: false
          in: query
          description: >-
            Tax Id of the seller. It is used to filter the seller configurations
            defined for the buyer. If not provided the seller configurations for
            all sellers linked to the application are returned.
          schema:
            example: '85661377000063'
            type: string
      responses:
        '200':
          description: The buyer's information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBuyerDto'
      security:
        - auth0_jwt: []
        - api_key: []
      summary: Get buyer
      tags:
        - Buyers
      x-credix-security:
        scopes: []
        onProviders:
          - api_key
        keyNames:
          - x-credipay-api-key
  /v1/invoices:
    post:
      description: >-
        Allows you to submit a Nota Fiscal XML file. If orderId is not provided,
        a new order is created. If orderId is provided, the invoice is linked to
        the specified order. For an invoice to be accepted, it needs to be
        within the buyer's available credit limit and maximum payment terms.
      operationId: post-submit-invoice-xml
      parameters:
        - name: orderId
          required: false
          in: query
          description: >-
            CrediPay's internal order ID. UUID v4 format. If provided the
            uploaded invoice will be linked to this order.
          schema:
            example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
            type: string
      requestBody:
        required: true
        description: >-
          Nota Fiscal XML file. Needs to have been processed and approved by
          SEFAZ (draft XMLs are not allowed).
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                invoice:
                  type: string
                  format: binary
              required:
                - invoice
      responses:
        '200':
          description: Successful operation, Invoice uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInvoiceResponseDto'
        '400':
          description: Could not process the invoice XML due to a format error.
      security:
        - auth0_jwt: []
        - api_key: []
      summary: Submit Invoice XML
      tags:
        - Invoices
      x-credix-security:
        scopes: []
        onProviders:
          - api_key
        keyNames:
          - x-credipay-api-key
    get:
      description: Get all the invoices linked to the application.
      operationId: get-invoices
      parameters:
        - description: Returns invoices with the provided order id.
          required: false
          name: orderId
          in: query
          schema:
            example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
            type: string
        - description: Returns invoices with the provided external id.
          required: false
          name: externalId
          in: query
          schema:
            example: REF-10230456
            type: string
        - description: Returns invoices with the provided invoice number.
          required: false
          name: invoiceNumber
          in: query
          schema:
            example: Invoice-123456
            type: string
        - description: Updated after UTC date in ISO 8601 format.
          required: false
          name: updatedAfter
          in: query
          schema:
            default: '2024-02-05T00:00:00Z'
            type: string
      responses:
        '200':
          description: All invoices linked to the application.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceResponseDto'
      security:
        - auth0_jwt: []
        - api_key: []
      summary: Gets all the invoices
      tags:
        - Invoices
      x-credix-security:
        scopes: []
        onProviders:
          - api_key
        keyNames:
          - x-credipay-api-key
  /v1/webhook-events/endpoints/{endpointId}/resend:
    post:
      description: >-
        This endpoint lets customers resend failed webhooks. Messages sent
        successfully are not resent. The endpoint Id required can be found in
        the webhooks dashboard
      operationId: post-resend-failed-webhooks
      parameters:
        - name: endpointId
          required: true
          in: path
          description: Endpoint ID. Please get the endpoint Id from webhooks dashboard.
          schema:
            type: string
      requestBody:
        required: true
        description: Request body to resend failed webhooks.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhooksResendRequestDto'
      responses:
        '200':
          description: Successful operation.
        '500':
          description: Internal Server Error.
      security:
        - auth0_jwt: []
        - api_key: []
      summary: Resend failed webhooks.
      tags:
        - Webhooks
      x-credix-security:
        scopes: []
        onProviders:
          - api_key
        keyNames:
          - x-credipay-api-key
info:
  title: Credipay API
  description: ''
  version: '1.0'
  contact: {}
tags: []
servers:
  - url: https://api.pre.credix.finance
    description: Sandbox
components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: X-CREDIPAY-API-KEY
  schemas:
    GetBuyerSellerConfigDto:
      type: object
      properties:
        taxId:
          type: string
          description: Seller's tax ID
          example: '82356350000079'
        maxPaymentTermDays:
          type: number
          description: The maximum payment term days.
          example: 30
        monthlyDiscountRate:
          type: number
          description: Monthly discount rate
          example: 0.03
        transactionFeePercentage:
          type: number
          description: Transaction fee percentage
          example: 0.02
          deprecated: true
        baseTransactionFeePercentage:
          type: number
          description: base transaction fee percentage
          example: 0.02
        variableTransactionFeePercentage:
          type: object
          description: variable transaction fee percentage
          example: 0.02
        variableTransactionFeeIntervalDays:
          type: object
          description: variable transaction fee interval days
          example: 12
      required:
        - taxId
        - maxPaymentTermDays
        - monthlyDiscountRate
        - transactionFeePercentage
        - baseTransactionFeePercentage
        - variableTransactionFeePercentage
        - variableTransactionFeeIntervalDays
    GetBuyerDto:
      type: object
      properties:
        taxId:
          type: string
          description: The tax ID of the company
          example: '70631413000079'
        name:
          type: string
          description: Company's name.
          example: ACME ltda.
        sellerConfigs:
          description: Seller configurations for the buyer.
          type: array
          items:
            $ref: '#/components/schemas/GetBuyerSellerConfigDto'
        creditLimitAmountCents:
          type: number
          description: Total credit limit in cents
          example: 1020000
        availableCreditLimitAmountCents:
          type: number
          description: Available credit limit in cents
          example: 820000
        onboarded:
          type: boolean
          description: Whether or not the buyer has completed the onboarding
          example: false
        eligible:
          type: boolean
          description: Whether or not the buyer is eligible for credit
          example: false
        paymentProvider:
          type: string
          description: The payment provider for the buyer
          example: BtgBoleto
          enum:
            - Manual
            - StarkbankPixInvoice
            - StarkbankBoleto
            - BtgBoleto
            - BtgBolePix
            - BtgEverestBoleto
      required:
        - taxId
        - name
        - sellerConfigs
        - creditLimitAmountCents
        - availableCreditLimitAmountCents
        - onboarded
        - eligible
        - paymentProvider
    InvoiceOrderContactInformationDto:
      type: object
      properties:
        email:
          type: string
          description: Contact email.
          example: info@example.com
        phone:
          type: string
          description: Contact phone.
          example: +55 11 99999-9999
      required:
        - email
        - phone
    InvoiceOrderDto:
      type: object
      properties:
        id:
          type: string
          description: CrediPay's internal order ID.
          example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
        externalId:
          type: string
          description: Seller's internal order ID.
          example: REF-10230456
        status:
          type: string
          description: Order status.
          enum:
            - new
            - created
            - accepted
            - cancelled
            - rejected
            - finalized
            - captured
            - expired
            - ineligible
            - invalidated
            - validating
            - declined
            - waiting_for_invoice
            - validation_failed
            - nf_validation_failed
            - partially_refunded
            - fully_refunded
            - waiting_for_otp
            - partially_captured
          example: created
        contactInformation:
          description: Contact information.
          allOf:
            - $ref: '#/components/schemas/InvoiceOrderContactInformationDto'
      required:
        - id
        - externalId
        - status
        - contactInformation
    InvoicePayerDto:
      type: object
      properties:
        name:
          type: string
          description: Payer company name.
          example: Aurora Soluções Ltda.
        taxId:
          type: string
          description: Payer tax ID.
          example: 73.682.637/0000-06
        sendConfirmationLink:
          type: boolean
          description: >-
            Whether or not a confirmation link will be sent for the order to the
            buyer
          example: false
      required:
        - name
        - taxId
        - sendConfirmationLink
    InstallmentDto:
      type: object
      properties:
        id:
          type: string
          description: Installment ID.
          example: f56ac4ff-4a1f-471d-ba14-e22c64bc769c
        status:
          type: string
          description: Installment status.
          enum:
            - Created
            - Settled
            - Advanced
          example: Advanced
        faceValueCents:
          type: number
          description: Face value cents.
          example: 10000
        fundedAt:
          type: object
          description: >-
            Funded date in ISO 8601 format. Defaults to null if the installment
            has yet to be funded.
          example: '2024-02-20T00:00:00.000Z'
        settledAt:
          type: object
          description: >-
            Settled date in ISO 8601 format. Defaults to null if the installment
            has yet to be settled.
          example: '2024-02-20T00:00:00.000Z'
        disbursedAmountCents:
          type: number
          description: >-
            Disbursed amount cents. Defaults to 0 if no disbursement has been
            made.
          example: 10000
          default: 0
        refundAmountCents:
          type: number
          description: Refund value cents.
          example: 10000
        refundStatus:
          type: string
          description: Refund status.
          enum:
            - NoRefund
            - PartialRefund
            - FullRefund
          example: NoRefund
        latestRefundDate:
          type: object
          description: >-
            Latest refund date in ISO 8601 format. Defaults to null if the
            installment has not been refunded.
          example: '2024-02-20T00:00:00.000Z'
        maturityDate:
          type: string
          description: Maturity date in ISO 8601 format.
          example: '2024-02-29T00:00:00.000Z'
      required:
        - id
        - status
        - faceValueCents
        - fundedAt
        - settledAt
        - disbursedAmountCents
        - refundAmountCents
        - refundStatus
        - latestRefundDate
        - maturityDate
    CreateInvoiceResponseDto:
      type: object
      properties:
        id:
          type: object
          description: Credipay's internal invoice ID. UUID v4 format.
          example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
        dueDate:
          type: string
          description: >-
            Invoice due date in ISO 8601 format. In the case of multiple
            installments, this is the due date of the last installment.
          example: '2024-02-29T00:00:00.000Z'
        entityCreateStatus:
          type: string
          description: Entity which is created during the process.
          enum:
            - OrderCreated
            - InvoiceCreated
          example: OrderCreated
        originalFaceValueCents:
          type: number
          description: Invoice face value cents.
          example: 10000
        order:
          description: The order associated with this invoice
          allOf:
            - $ref: '#/components/schemas/InvoiceOrderDto'
        payer:
          description: The payer of the invoice
          allOf:
            - $ref: '#/components/schemas/InvoicePayerDto'
        currentFaceValueCents:
          type: object
          description: Invoice face value cents.
          example: 10000
        installments:
          description: Invoice installments.
          type: array
          items:
            $ref: '#/components/schemas/InstallmentDto'
        invoiceNumber:
          type: string
          description: Invoice number. Extracted from the NF-e.
          example: NFe35240341264992000141550010000007431018280440
        issuanceDate:
          type: string
          description: Invoice issuance date in ISO 8601 format. Extracted from the NF-e.
          example: '2024-02-29T00:00:00.000Z'
        refundAmountCents:
          type: object
          description: Refund value cents.
          example: 10000
        refundStatus:
          type: string
          description: Refund status.
          enum:
            - NoRefund
            - PartialRefund
            - FullRefund
          example: NoRefund
        faceValueCents:
          type: object
          description: Invoice face value cents.
          example: 10000
          deprecated: true
      required:
        - id
        - dueDate
        - entityCreateStatus
        - originalFaceValueCents
        - order
        - payer
        - currentFaceValueCents
        - installments
        - invoiceNumber
        - issuanceDate
        - refundAmountCents
        - refundStatus
        - faceValueCents
    RepaymentDto:
      type: object
      properties:
        id:
          type: string
          description: Repayment ID.
          example: f56ac4ff-4a1f-471d-ba14-e22c64bc769c
        status:
          type: string
          description: repayment status.
          enum:
            - open
            - paid
            - restructured
            - renegotiated
          example: open
        amount:
          type: number
          description: Amount value cents.
          example: 10000
        dueDate:
          type: string
          description: >-
            Invoice due date in ISO 8601 format. In the case of multiple
            installments, this is the due date of the last installment.
          example: '2024-02-29T00:00:00.000Z'
        repaymentDate:
          type: object
          description: >-
            Repayment date in ISO 8601 format. Defaults to null if the repayment
            has yet to be made.
          example: '2024-02-20T00:00:00.000Z'
        pdfURL:
          type: object
          description: Repayment PDF URL
          example: https://pdfurl.com
          default: https://pdfurl.com
      required:
        - id
        - status
        - amount
        - dueDate
        - repaymentDate
        - pdfURL
    InvoiceResponseDto:
      type: object
      properties:
        id:
          type: string
          description: Credipay's internal invoice ID. UUID v4 format.
          example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
        invoiceNumber:
          type: string
          description: Invoice number. Extracted from the NF-e.
          example: NFe35240341264992000141550010000007431018280440
        dueDate:
          type: string
          description: >-
            Invoice due date in ISO 8601 format. In the case of multiple
            installments, this is the due date of the last installment.
          example: '2024-02-29T00:00:00.000Z'
        issuanceDate:
          type: string
          description: Invoice issuance date in ISO 8601 format. Extracted from the NF-e.
          example: '2024-02-29T00:00:00.000Z'
        originalFaceValueCents:
          type: number
          description: Invoice face value cents.
          example: 10000
        faceValueCents:
          type: number
          description: Invoice face value cents.
          example: 10000
          deprecated: true
        currentFaceValueCents:
          type: number
          description: Invoice face value cents.
          example: 10000
        refundAmountCents:
          type: number
          description: Refund value cents.
          example: 10000
        refundStatus:
          type: string
          description: Refund status.
          enum:
            - NoRefund
            - PartialRefund
            - FullRefund
          example: NoRefund
        installments:
          description: Invoice installments.
          type: array
          items:
            $ref: '#/components/schemas/InstallmentDto'
        repayments:
          description: Invoice repayments.
          type: array
          items:
            $ref: '#/components/schemas/RepaymentDto'
        order:
          description: The order associated with this invoice
          allOf:
            - $ref: '#/components/schemas/InvoiceOrderDto'
        payer:
          description: The payer of the invoice
          allOf:
            - $ref: '#/components/schemas/InvoicePayerDto'
      required:
        - id
        - invoiceNumber
        - dueDate
        - issuanceDate
        - originalFaceValueCents
        - faceValueCents
        - currentFaceValueCents
        - refundAmountCents
        - refundStatus
        - installments
        - repayments
        - order
        - payer
    OrderErrorDto:
      type: object
      properties:
        code:
          type: object
          description: Error code.
          example: ORDER_NOT_FOUND_ERROR
        message:
          type: object
          description: Error message.
          example: Order not found.
      required:
        - code
        - message
    OrderEventWebhookBody:
      type: object
      properties:
        eventType:
          type: string
          description: Event type.
          enum:
            - order.created
            - order.cancelled
            - order.validation.failed
            - order.buyer.rejected
            - order.accepted
            - order.captured
            - order.partially_captured
            - order.buyer.accepted
            - order.boletos.issued
          example: order.buyer.accepted
        orderId:
          type: object
          description: The CrediPay order identifier.
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        orderExternalId:
          type: string
          description: >-
            The order identifier as set by the integrator. It is present when
            the order was created with an external id.
          example: or-123
        confirmationDate:
          type: string
          description: The acceptance date of the order, if it was accepted by the buyer.
          example: '2022-01-01T00:00:00Z'
        buyerTaxId:
          type: object
          description: Buyer Tax Id (CNPJ).
          example: '12345678000196'
        errors:
          description: Errors that occurred during the order process.
          example:
            - code: ORDER_NOT_FOUND_ERROR
              message: Order not found.
          type: array
          items:
            $ref: '#/components/schemas/OrderErrorDto'
      required:
        - eventType
        - orderId
        - buyerTaxId
        - errors
    RepaymentEventWebhookBody:
      type: object
      properties:
        eventType:
          type: string
          description: Event type.
          enum:
            - repayment.created
            - repayment.settled
            - repayment.cancelled
            - repayment.processing
            - repayment.edited
          example: repayment.created
        orderId:
          type: string
          description: The CrediPay order identifier.
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        orderExternalId:
          type: string
          description: >-
            The order identifier as set by the integrator. It is present when
            the order was created with an external id.
          example: or-123
          nullable: true
        invoiceId:
          type: string
          description: The CrediPay invoice identifier.
          example: facc63bc-5d73-4251-ab93-95ecd5338735
        invoiceNumber:
          type: string
          description: Invoice Number (= Nota Fiscal number).
          example: NFe35240737154724000108550010001280021404361475
        repaymentId:
          type: object
          description: The CrediPay repayment identifier
          example: 310b728e-8456-4495-b680-9a59d7a45e07
          nullable: true
        buyerTaxId:
          type: string
          description: Buyer Tax Id (CNPJ).
          example: '12345678000196'
        dueDate:
          format: date-time
          type: string
          description: Due date
          example: '2022-01-01T00:00:00Z'
        totalAmountCents:
          type: number
          description: Total amount in cents.
          example: 10000
        paymentCode:
          type: string
          description: >-
            Barcode/code, present if the repayment method is Boleto, BolePix or
            Pix.
          example: 34191.09008 64060.401046 00000.000000 1 00000000000000
          nullable: true
        pixEmv:
          type: string
          description: PIX EMV code, present if the repayment method is Pix or BolePix.
          example: >-
            00020101021126580014BR.GOV.BCB.PIX0136b69bc1f6-3f24-4d4b-8e15-12d29bf257cb5204000053039865802BR5920CREDIPAY
            TESTE LTDA6009SAO PAULO62070503***6304A1B2
          nullable: true
        paymentPdfUrl:
          type: string
          description: >-
            The pdf to make the payment, present if the repayment method is
            Boleto, BolePix or Pix.
          example: https://example.com/boleto.pdf
          nullable: true
        paidAmountCents:
          type: number
          description: Paid amount in cents, only present if the repayment is settled.
          example: 10000
          nullable: true
        repaymentParentId:
          type: string
          description: >-
            Parent repayment id, present if this repayment is created as a
            result of a refund/renegotiation. The parent repayment will be
            canceled.
          example: 520b728e-8456-4495-b680-9a59d7a452302
          nullable: true
        refundStatus:
          type: string
          description: The refund status of the order this repayment is associated with.
          enum:
            - NoRefund
            - PartialRefund
            - FullRefund
          example: NoRefund
        paymentMethod:
          type: string
          description: The payment method used to pay the repayment.
          enum:
            - Manual
            - StarkbankPixInvoice
            - StarkbankBoleto
            - BtgBoleto
            - BtgBolePix
            - BtgEverestBoleto
          example: BtgBolePix
        repaymentCreationEvent:
          type: string
          description: The event that led to the creation of the repayment.
          enum:
            - invoiceUploaded
            - refund
            - renegotiation
          example: invoiceUploaded
          nullable: true
      required:
        - eventType
        - orderId
        - invoiceId
        - invoiceNumber
        - repaymentId
        - buyerTaxId
        - dueDate
        - totalAmountCents
        - refundStatus
        - paymentMethod
    CreditLimitUnderwriteFinishedEventWebhookBody:
      type: object
      properties:
        eventType:
          type: string
          description: Event type.
          enum:
            - credit-limit.underwrite.finished
            - credit-limit.increase.finished
            - credit-limit.admin.underwrite.finished
          example: credit-limit.underwrite.finished
        id:
          type: string
          description: The ID of the credit limit underwrite request.
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        sellerTaxId:
          type: string
          description: The tax ID of the seller.
          example: '12345678000196'
        status:
          type: string
          description: The status of the credit limit underwrite request.
          enum:
            - Pending
            - Failed
            - Rejected
            - Finished
          example: Finished
        reason:
          type: string
          description: The reason for the 'Failed' or 'Rejected' states.
          example: Insufficient credit history
          nullable: true
        retryAfter:
          format: date-time
          type: string
          description: >-
            A datetime from which it is allowed to retry. Can be null if retry
            is not allowed
          example: '2024-03-20T10:00:00Z'
          nullable: true
        buyerTaxId:
          type: string
          description: The tax ID of the buyer.
          example: '12345678000196'
        creditLimitCents:
          type: number
          description: The current credit limit in cents.
          example: 1000000
        eligible:
          type: boolean
          description: Whether the buyer is eligible for credit.
          example: true
      required:
        - eventType
        - id
        - sellerTaxId
        - status
        - buyerTaxId
        - creditLimitCents
        - eligible
    CreditLimitIncreaseFinishedWebhookBody:
