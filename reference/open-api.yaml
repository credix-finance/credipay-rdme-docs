openapi: 3.0.0
paths:
  /v2/buyers:
    get:
      description: Obtém todos os compradores associados a um vendedor.
      operationId: BuyersController_getBuyers
      parameters:
        - name: taxId
          required: false
          in: query
          description: CNPJ do comprador.
          schema:
            example: '56596567000127'
            type: string
        - name: page
          required: false
          in: query
          description: Qual página retornar da lista de compradores. Começa em 1.
          schema:
            minimum: 1
            default: 1
            type: number
        - name: take
          required: false
          in: query
          description: Limite de compradores a serem retornados.
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
      responses:
        '200':
          description: Operação bem-sucedida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBuyersResponseDto'
      summary: Obter compradores
      tags:
        - Buyers
  /v2/orders/{id}:
    get:
      description: Obtém um pedido pelo ID interno de pedido da CrediPay.
      operationId: OrdersController_getOrderById
      parameters:
        - name: id
          required: true
          in: path
          description: ID interno de pedido da CrediPay. Formato UUID v4.
          schema:
            format: uuid
            example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
            type: string
      responses:
        '200':
          description: Operação bem-sucedida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrderResponseDto'
        '404':
          description: Pedido não foi encontrado.
      summary: Obter um pedido
      tags:
        - Orders
  /v2/orders/search:
    post:
      description: Pesquisa pedidos por diversos critérios.
      operationId: OrdersController_searchOrders
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchOrdersRequestDto'
      responses:
        '200':
          description: Operação bem-sucedida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchOrdersResponseDto'
      summary: Pesquisar pedidos
      tags:
        - Orders
  /v2/orders:
    post:
      description: Cria um pedido enviando um payload JSON.
      operationId: OrdersController_postOrder
      parameters: []
      requestBody:
        required: true
        description: Dados do pedido.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderDtoOpenApiSpec'
      responses:
        '201':
          description: Operação bem-sucedida, pedido criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrderResponseDto'
      summary: Criar um pedido
      tags:
        - Orders
  /v2/orders/invoices:
    post:
      description: >-
        Permite criar um pedido enviando um arquivo XML de Nota Fiscal. Se
        orderId não for informado, um novo pedido é criado. Se orderId for
        informado, a nota fiscal é vinculada ao pedido especificado. Para que
        uma nota fiscal seja aceita, ela precisa estar dentro do limite de
        crédito disponível do comprador e do prazo máximo de pagamento.
      operationId: OrdersController_postInvoiceXml
      parameters: []
      requestBody:
        required: true
        description: >-
          Arquivo XML de Nota Fiscal. Precisa ter sido processado e aprovado
          pela SEFAZ (XMLs de rascunho não são permitidos).
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                invoice:
                  type: string
                  format: binary
              required:
                - invoice
      responses:
        '400':
          description: >-
            Não foi possível processar o XML da nota fiscal devido a um erro de
            formato.
      summary: Criar um pedido por NF-e
      tags:
        - Orders
        - Invoices
  /v2/orders/{id}/capture:
    post:
      description: >-
        Este é um endpoint assíncrono que permite enviar um arquivo XML de Nota
        Fiscal para um pedido. Assim que o arquivo XML é enviado, um job será
        disparado para realizar validações e capturar o pedido.
      operationId: OrdersController_captureOrder
      parameters:
        - name: id
          required: true
          in: path
          description: ID interno de pedido da CrediPay. Formato UUID v4.
          schema:
            example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
            type: string
      requestBody:
        required: true
        description: >-
          Arquivo XML de Nota Fiscal. Precisa ter sido processado e aprovado
          pela SEFAZ (XMLs de rascunho não são permitidos).
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                invoice:
                  type: string
                  format: binary
              required:
                - invoice
      responses:
        '400':
          description: >-
            Não foi possível mover o pedido para o estado de validação devido a
            um erro.
      summary: Capturar pedido
      tags:
        - Orders
  /v2/orders/{id}/refund:
    post:
      description: >-
        Este é um endpoint assíncrono que permite solicitar um reembolso de um
        pedido existente.
      operationId: OrdersController_refundOrder
      parameters:
        - name: id
          required: true
          in: path
          description: ID interno de pedido da CrediPay. Formato UUID v4.
          schema:
            example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
            type: string
      requestBody:
        required: true
        description: Dados da solicitação de reembolso.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundOrderDto'
      responses:
        '200':
          description: Operação bem-sucedida, solicitação de reembolso criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundOrderResponseDto'
        '400':
          description: >-
            Não foi possível mover o pedido para o estado de validação devido a
            um erro.
      summary: Reembolsar pedido
      tags:
        - Orders
  /v2/orders/{id}/cancel:
    post:
      description: >-
        Move um pedido para o estado cancelado e aumenta o limite de crédito
        disponível do comprador pelo valor total desse pedido. Se o pedido já
        tiver uma nota fiscal vinculada, ele será totalmente reembolsado.
      operationId: OrdersController_cancelOrder
      parameters:
        - name: id
          required: true
          in: path
          description: ID interno de pedido da CrediPay. Formato UUID v4.
          schema:
            example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
            type: string
      responses:
        '204':
          description: Operação bem-sucedida, pedido cancelado.
        '404':
          description: Pedido não foi encontrado.
        '409':
          description: >-
            Não foi possível cancelar o pedido. O pedido pode já estar cancelado
            OU não está em nenhum dos seguintes estados [created, accepted,
            finalized, rejected].
      summary: Cancelar pedido
      tags:
        - Orders
  /v2/search:
    get:
      description: Realiza uma busca search-as-you-type nos dados de compradores e pedidos.
      operationId: SearchController_search
      parameters:
        - name: x-credipay-organization-id
          required: true
          in: header
          schema:
            type: string
        - name: q
          required: true
          in: query
          description: A consulta de busca.
          schema:
            example: comprador exemplo
            type: string
        - name: size
          required: false
          in: query
          description: Número máximo de resultados a retornar.
          schema:
            minimum: 1
            maximum: 100
            default: 10
            type: number
      responses:
        '200':
          description: Operação bem-sucedida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponseDto'
      summary: Buscar
      tags:
        - Search
  /v2/disbursements:
    get:
      description: >-
        Este endpoint permite obter uma lista de repasses com base em parâmetros
        específicos.
        https://docs.credipay.credix.finance/docs/adicional-reconcilia%C3%A7%C3%A3o
      operationId: SellerDisbursementsController_getSellerDisbursements
      parameters:
        - name: page
          required: false
          in: query
          description: Número da página dos repasses.
          schema:
            minimum: 1
            default: 1
            example: 1
            type: number
        - name: take
          required: false
          in: query
          description: Quantidade de repasses a retornar.
          schema:
            minimum: 1
            maximum: 100
            default: 10
            example: 10
            type: number
        - name: startDate
          required: true
          in: query
          description: Data inicial dos repasses.
          schema:
            example: '2025-01-01'
            type: string
        - name: endDate
          required: false
          in: query
          description: Data final dos repasses.
          schema:
            default: '2026-02-20'
            example: '2025-01-01'
            type: string
        - name: includePending
          required: false
          in: query
          description: Inclui repasses pendentes quando true.
          schema:
            default: false
            example: false
            type: boolean
      responses:
        '200':
          description: Operação bem-sucedida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerDisbursementsResponseDto'
      summary: Buscar repasses de vendedores
      tags:
        - Disbursements
info:
  title: Credipay API
  description: ''
  version: '2.0'
  contact: {}
tags: []
servers:
  - url: https://api.pre.credix.finance
    description: Sandbox
components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: X-CREDIPAY-API-KEY
  schemas:
    BuyerGroupMemberDto:
      type: object
      properties:
        taxId:
          type: string
          description: CNPJ do membro do grupo.
          example: '56596567000127'
        name:
          type: string
          description: Nome do membro do grupo.
          example: Comprador Inexistente LTDA
      required:
        - taxId
        - name
    BuyerResponseDto:
      type: object
      properties:
        id:
          type: string
          description: ID do comprador. (UUID)
          example: a0eebc4b-1f3d-4b2a-8c5f-7e6d5f8e9b2f
        taxId:
          type: string
          description: CNPJ do comprador.
          example: '56596567000127'
        availableCreditLimitAmountCents:
          type: number
          description: Limite de crédito disponível do comprador em centavos.
          example: 100000
        creditLimitAmountCents:
          type: number
          description: Limite de crédito do comprador em centavos.
          example: 100000
        creditLimitUpdatedAt:
          type: string
          description: Data de atualização do limite de crédito do comprador.
          example: '2021-01-01T00:00:00.000Z'
        eligible:
          type: boolean
          description: Se o comprador é elegível ou não para crédito.
          example: true
          deprecated: true
        eligibilityUpdatedAt:
          type: string
          description: Data de atualização da elegibilidade do comprador.
          example: '2021-01-01T00:00:00.000Z'
        inactive:
          type: boolean
          description: Se o comprador está marcado como inativo.
          example: false
        maxPaymentTermDays:
          type: number
          description: O prazo máximo de pagamento em dias.
        name:
          type: string
          description: Nome da empresa do comprador.
          example: Comprador Inexistente LTDA
        onboarded:
          type: boolean
          description: Se o comprador completou ou não o processo de onboarding.
          example: true
        groupMembers:
          description: Membros do grupo do comprador.
          type: array
          items:
            $ref: '#/components/schemas/BuyerGroupMemberDto'
      required:
        - id
        - taxId
        - availableCreditLimitAmountCents
        - creditLimitAmountCents
        - creditLimitUpdatedAt
        - eligible
        - eligibilityUpdatedAt
        - inactive
        - maxPaymentTermDays
        - name
        - onboarded
        - groupMembers
    GetBuyersResponseDto:
      type: object
      properties:
        data:
          description: Lista de compradores.
          type: array
          items:
            $ref: '#/components/schemas/BuyerResponseDto'
        page:
          type: number
          description: Número da página.
          example: 1
        items:
          type: number
          description: Número de itens na página atual.
          example: 20
        total:
          type: number
          description: Número total de itens em todas as páginas.
          example: 100
      required:
        - data
        - page
        - items
        - total
    InvoiceResponseDto:
      type: object
      properties:
        id:
          type: string
          description: ID único da nota fiscal no sistema do CrediPay.
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
        invoiceNumber:
          type: string
          description: Número da nota fiscal.
          example: NFe00000000000000000000000001642012886703226971
        shortInvoiceNumber:
          type: string
          description: Número curto da nota fiscal.
          example: '0992346'
          nullable: true
        issuanceDate:
          type: string
          description: Data e hora de emissão da nota fiscal (ISO).
          example: '2023-10-02T15:30:00Z'
          format: date-time
        totalAmountCents:
          type: number
          description: Valor total da nota fiscal em centavos.
          example: 150000
      required:
        - id
        - invoiceNumber
        - issuanceDate
        - totalAmountCents
    OrderBuyerDto:
      type: object
      properties:
        id:
          type: string
          description: ID do comprador.
          example: a0eebc4b-1f3d-4b2a-8c5f-7e6d5f8e9b2f
          format: uuid
        taxId:
          type: string
          description: CNPJ do comprador.
          example: '56596567000127'
        name:
          type: string
          description: Nome do comprador.
          example: Comprador Inexistente LTDA
      required:
        - id
        - taxId
        - name
    OrderSellerDto:
      type: object
      properties:
        id:
          type: string
          description: ID do vendedor.
          example: a0eebc4b-1f3d-4b2a-8c5f-7e6d5f8e9b2f
          format: uuid
        taxId:
          type: string
          description: CNPJ do vendedor.
          example: '56596567000127'
        name:
          type: string
          description: Nome do vendedor.
          example: Nome Fictício Distribuidora LTDA
      required:
        - id
        - taxId
        - name
    RepaymentIssuerDto:
      type: object
      properties:
        taxId:
          type: string
          description: CNPJ da facility (emissor).
          example: '12345678000190'
        razaoSocial:
          type: string
          description: Razão social da facility (emissor).
          example: Credix Securitizadora III S.A.
      required:
        - taxId
        - razaoSocial
    RepaymentPayeeDto:
      type: object
      properties:
        branchNumber:
          type: string
          description: Número da agência bancária.
          example: '0001'
        branchDigit:
          type: string
          description: Dígito da agência bancária.
          example: '1'
        accountNumber:
          type: string
          description: Número da conta bancária.
          example: '12345678'
        accountDigit:
          type: string
          description: Dígito da conta bancária.
          example: '9'
        bankIdentificationCode:
          type: string
          description: Código de identificação bancária (ISPB).
          example: '001'
      required:
        - branchNumber
        - branchDigit
        - accountNumber
        - accountDigit
        - bankIdentificationCode
    RepaymentResponseDto:
      type: object
      properties:
        id:
          type: string
          description: ID único do pagamento.
          example: e912ba21-d530-4982-aa92-a06d7518afa0
          format: uuid
        pdfUrl:
          type: string
          description: URL para o arquivo PDF do pagamento (boleto).
          example: >-
            https://api.starkbank.com/v2/invoice/fb1553149ff34c8db238f36dc64a8232.pdf
        status:
          type: string
          description: Status do pagamento.
          example: Open
          enum:
            - Open
            - ProcessingPayment
            - Paid
            - Canceled
            - Expired
            - Unknown
            - Failed
            - CancellationFailed
            - Reversed
        totalAmountCents:
          type: number
          description: Valor total a ser pago em centavos.
          example: 100000
        createdAt:
          type: string
          description: Data e hora em que o pagamento foi criado.
          example: '2023-10-01T12:00:00Z'
          format: date-time
        dueDate:
          type: string
          description: Data de vencimento do pagamento.
          example: '2023-10-15T12:00:00Z'
          format: date-time
        paymentDate:
          type: string
          description: Data real em que o pagamento foi efetuado.
          example: '2023-10-10T12:00:00Z'
          format: date-time
          nullable: true
        paidAmountCents:
          type: number
          description: Valor efetivamente pago em centavos.
          example: 50000
        parentId:
          type: string
          description: "ID do pagamento pai, se aplicável (ex.: vinculado a outro pagamento). \t\t\tQuando um pedido é reembolsado, ou um pagamento é renegociado/estendido, o pagamento pai \t\t\tserá cancelado e um novo será criado."
          example: 3b27b131-7ab7-4a67-b88e-424c1d30b247
          format: uuid
          nullable: true
        documentNumber:
          type: string
          description: >-
            Número do documento: número curto da nota fiscal + '-' + número
            único do ativo.
          example: 0992346-001
          nullable: true
        duplicata:
          type: string
          description: Número único da duplicata (parcela).
          example: '123456789'
          nullable: true
        paymentCode:
          type: string
          description: Código de pagamento do boleto.
          example: 34191.79001 01043.510047 91020.150008 6 91570000002000
          nullable: true
        pixEmv:
          type: string
          description: Código EMV para pagamento via PIX.
          example: 00020101021126580014BR.GOV.BCB.PIX0136b69bc...
          nullable: true
        issuer:
          description: Informações do emissor (facility).
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RepaymentIssuerDto'
        payee:
          description: Informações do beneficiário (conta bancária da empresa vendedora).
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RepaymentPayeeDto'
        monthlyLateFeeRate:
          type: number
          description: Taxa de juros mensal por atraso.
          example: 0.02
        fixedLateFeePercentage:
          type: number
          description: Percentual fixo de multa por atraso.
          example: 0.1
      required:
        - id
        - pdfUrl
        - status
        - totalAmountCents
        - createdAt
        - dueDate
        - paymentDate
        - paidAmountCents
        - parentId
        - documentNumber
        - issuer
        - payee
        - monthlyLateFeeRate
        - fixedLateFeePercentage
    OrderErrorDto:
      type: object
      properties:
        code:
          type: string
          description: Código do erro.
          example: INVALID_TAX_ID
        message:
          type: string
          description: Mensagem de erro.
          example: O CNPJ fornecido é inválido.
      required:
        - code
        - message
    OrderRefundDto:
      type: object
      properties:
        id:
          type: string
          description: ID único do reembolso.
          example: e912ba21-d530-4982-aa92-a06d7518afa0
          format: uuid
        amountCents:
          type: number
          description: Valor do reembolso em centavos.
          example: 50000
        status:
          type: string
          description: Status do reembolso.
          example: Pending
          enum:
            - Pending
            - Completed
            - Failed
        createdAt:
          type: string
          description: Data e hora em que o reembolso foi criado.
          example: '2023-10-01T12:00:00Z'
          format: date-time
        error:
          type: string
          description: O erro que ocorreu durante o reembolso.
          example: Invalid tax ID format.
          nullable: true
      required:
        - id
        - amountCents
        - status
        - createdAt
        - error
    GetOrderResponseDto:
      type: object
      properties:
        id:
          type: string
          description: ID interno do pedido no CrediPay. Formato UUID v4.
          example: 46dd63dd-1be4-4658-8deb-fa5dc578ad0b
          format: uuid
        createdAt:
          type: string
          description: Data de criação do pedido.
          example: '2023-10-01T12:00:00Z'
          format: date-time
        updatedAt:
          type: string
          description: Data de atualização do pedido.
          example: '2023-10-01T12:00:00Z'
          format: date-time
        acceptedAt:
          type: string
          description: Data em que o pedido foi aceito pelo comprador.
          example: '2023-10-01T12:00:00Z'
          format: date-time
        disbursedAt:
          type: string
          description: Data em que o pedido foi desembolsado para o vendedor.
          example: '2023-10-01T12:00:00Z'
          format: date-time
        capturedAt:
          type: string
          description: Data em que o pedido foi capturado (criação da nota fiscal).
          example: '2023-10-01T12:00:00Z'
          format: date-time
        externalId:
          type: string
          description: ID externo do pedido, se houver.
          example: '123456789'
        status:
          type: string
          description: Status do pedido.
          example: Accepted
          enum:
            - New
            - Created
            - Accepted
            - Cancelled
            - WaitingForInvoice
            - Captured
            - Expired
            - Validating
            - ValidationFailed
            - NfValidationFailed
            - PartiallyRefunded
            - FullyRefunded
            - WaitingForOtp
        invoice:
          description: Nota fiscal do pedido.
          allOf:
            - $ref: '#/components/schemas/InvoiceResponseDto'
        buyer:
          description: Comprador do pedido.
          allOf:
            - $ref: '#/components/schemas/OrderBuyerDto'
        seller:
          description: Vendedor do pedido.
          allOf:
            - $ref: '#/components/schemas/OrderSellerDto'
        repayments:
          description: Informações de pagamento do pedido.
          type: array
          items:
            $ref: '#/components/schemas/RepaymentResponseDto'
        errors:
          description: "Qualquer tipo de erro que pode ocorrer durante a vida útil de um pedido. \t\t\tTanto erros de reembolso quanto de validação de nota fiscal estão incluídos aqui. \t\t\tErros de validação anteriores não são incluídos após uma nova tentativa bem-sucedida de upload de nota fiscal."
          type: array
          items:
            $ref: '#/components/schemas/OrderErrorDto'
        refunds:
          description: Reembolsos do pedido.
          type: array
          items:
            $ref: '#/components/schemas/OrderRefundDto'
        metadata:
          type: object
          description: Metadados passados pelo vendedor na criação do pedido.
          additionalProperties: true
          example:
            yourCustomFieldName: yourCustomFieldValue
        totalAmountCents:
          type: number
          description: "Valor total do pedido em centavos. \t\t \tSe o pedido tiver uma nota fiscal, este valor é retirado da nota fiscal;\n\t\t\tcaso contrário, é retirado do próprio pedido."
          example: 12345
      required:
        - id
        - createdAt
        - updatedAt
        - externalId
        - status
        - invoice
        - buyer
        - seller
        - repayments
        - errors
        - refunds
        - metadata
        - totalAmountCents
    TaxIdFilterDto:
      type: object
      properties:
        value:
          type: string
          description: Tax ID do comprador. Filtra os pedidos pelo tax ID do comprador.
          example: '12345678901234'
        includeGroup:
          type: boolean
          description: >-
            Se true, filtra os pedidos pelo grupo econômico vinculado ao
            comprador com o tax ID especificado. Se false ou não fornecido,
            filtra apenas pelo tax ID do comprador.
          example: false
          default: false
      required:
        - value
    SearchOrdersRequestDto:
      type: object
      properties:
        query:
          type: string
          description: A consulta a ser pesquisada.
        status:
          description: Considerar apenas pedidos com estes status.
          example:
            - Created
          type: array
          items:
            type: array
        createdAfter:
          format: date-time
          type: string
          description: Considerar apenas pedidos criados em ou após esta data.
          example: '2021-01-01T00:00:00.000Z'
        createdBefore:
          format: date-time
          type: string
          description: Considerar apenas pedidos criados antes ou em esta data.
          example: '2021-01-02T00:00:00.000Z'
        page:
          type: number
          description: Qual página retornar da lista de pedidos. Começa em 1.
          default: 1
          minimum: 1
        take:
          type: number
          description: Limite de pedidos a serem retornados.
          default: 20
          minimum: 1
          maximum: 100
        taxId:
          description: Filtro de Tax ID do comprador.
          allOf:
            - $ref: '#/components/schemas/TaxIdFilterDto'
      required:
        - query
    SearchOrdersResponseItemDto:
      type: object
      properties:
